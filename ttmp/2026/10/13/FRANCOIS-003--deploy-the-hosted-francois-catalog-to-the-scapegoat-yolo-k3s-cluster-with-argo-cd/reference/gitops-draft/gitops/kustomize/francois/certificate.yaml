# Wildcard names need DNS-01; the HTTP-01 issuer cannot issue them.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: francois-tls
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: francois
    app.kubernetes.io/component: ingress
spec:
  secretName: francois-tls
  issuerRef:
    name: letsencrypt-prod-dns01-digitalocean
    kind: ClusterIssuer
  dnsNames:
    - francois.yolo.scapegoat.dev
    - "*.apps.francois.yolo.scapegoat.dev"
