# kv/apps/francois/prod/pi -> Secret francois-pi. Keys are Pi file names:
# auth.json, models.json, models-store.json, settings.json. Only needed for
# --backend pi; the Deployment mounts it as optional.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: francois-pi
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: francois
  mount: kv
  type: kv-v2
  path: apps/francois/prod/pi
  refreshAfter: 5m
  destination:
    name: francois-pi
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
