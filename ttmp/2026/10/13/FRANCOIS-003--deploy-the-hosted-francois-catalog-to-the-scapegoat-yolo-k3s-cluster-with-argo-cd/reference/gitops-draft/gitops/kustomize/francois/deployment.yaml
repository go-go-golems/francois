apiVersion: apps/v1
kind: Deployment
metadata:
  name: francois
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: francois
    app.kubernetes.io/component: app
spec:
  # In-memory views, rooms, worker and asset-signing key: one replica only.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: francois
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: francois
        app.kubernetes.io/component: app
    spec:
      enableServiceLinks: false
      serviceAccountName: francois
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Replaces deploy/compose/bin/catalog-serve lines 5-14: copy only the
        # Pi provider files into a private writable directory.
        - name: prepare
          image: ghcr.io/go-go-golems/francois:sha-0000000
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              install -d -m 0700 /var/lib/francois/pi /var/lib/francois/worker /var/lib/francois/releases
              for f in auth.json models.json models-store.json settings.json; do
                if [ -f "/etc/francois/pi/$f" ]; then
                  install -m 0600 "/etc/francois/pi/$f" "/var/lib/francois/pi/$f"
                fi
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/francois
            - name: pi
              mountPath: /etc/francois/pi
              readOnly: true
      containers:
        - name: francois
          image: ghcr.io/go-go-golems/francois:sha-0000000
          imagePullPolicy: IfNotPresent
          env:
            - name: STRIPE_PRICE_ID
              valueFrom:
                secretKeyRef:
                  name: francois-runtime
                  key: stripe-price-id
            - name: FRANCOIS_ZITADEL_ORG_ID
              valueFrom:
                secretKeyRef:
                  name: francois-runtime
                  key: oidc-org-id
          args:
            - catalog
            - serve
            - --listen=0.0.0.0:8080
            - --public-url=https://francois.yolo.scapegoat.dev
            - --app-domain=apps.francois.yolo.scapegoat.dev
            - --migrate
            - --database-url-file=/run/secrets/francois/database-url
            - --release-dir=/var/lib/francois/releases
            - --worker-dir=/var/lib/francois/worker
            - --oidc-issuer=https://zitadel.yolo.scapegoat.dev
            - --oidc-client-id-file=/run/secrets/francois/oidc-client-id
            # Requires code change C1 (Section 7.2); remove until it ships.
            - --oidc-extra-scopes=urn:zitadel:iam:org:id:$(FRANCOIS_ZITADEL_ORG_ID)
            - --stripe-secret-key-file=/run/secrets/francois/stripe-secret-key
            - --stripe-webhook-secret-files=/run/secrets/francois/stripe-webhook-secret
            - --stripe-webhook-secret-files=/run/secrets/francois/stripe-webhook-secret-previous
            - --stripe-price-id=$(STRIPE_PRICE_ID)
            - --grant-ttl=30m
            - --backend=fake
            - --worker=/app/worker/dist/main.js
            - --pi-agent-dir=/var/lib/francois/pi
          ports:
            - name: http
              containerPort: 8080
          # Francois routes by exact Host; the kubelet's default Host
          # (<pod-ip>:8080) is answered with 421. Send the portal host.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: francois.yolo.scapegoat.dev
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - name: Host
                  value: francois.yolo.scapegoat.dev
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: francois.yolo.scapegoat.dev
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/francois
            - name: runtime
              mountPath: /run/secrets/francois
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: francois-data
        - name: runtime
          secret:
            secretName: francois-runtime
            defaultMode: 0440
            items:
              - {key: database-url, path: database-url}
              - {key: oidc-client-id, path: oidc-client-id}
              - {key: stripe-secret-key, path: stripe-secret-key}
              - {key: stripe-webhook-secret, path: stripe-webhook-secret}
              - {key: stripe-webhook-secret-previous, path: stripe-webhook-secret-previous}
        - name: pi
          secret:
            secretName: francois-pi
            optional: true
            defaultMode: 0440
