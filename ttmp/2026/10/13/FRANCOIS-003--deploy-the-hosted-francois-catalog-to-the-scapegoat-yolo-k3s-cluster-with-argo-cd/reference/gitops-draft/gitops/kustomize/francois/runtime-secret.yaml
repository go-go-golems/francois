# kv/apps/francois/prod/runtime -> Secret francois-runtime.
# Keys: database, username, password, database-url, oidc-client-id,
# oidc-org-id, stripe-secret-key, stripe-webhook-secret,
# stripe-webhook-secret-previous, stripe-price-id.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: francois-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: francois
  mount: kv
  type: kv-v2
  path: apps/francois/prod/runtime
  refreshAfter: 30s
  destination:
    name: francois-runtime
    create: true
    overwrite: true
  # Secret changes (for example a rotated webhook secret) restart the pod.
  rolloutRestartTargets:
    - kind: Deployment
      name: francois
