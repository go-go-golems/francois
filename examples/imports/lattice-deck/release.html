    ${shared}
    <p class="note">Everyone in a session runs the deck code and the agent code the others send. Work in sessions with people you trust.</p>
  </div></div>`;
}

/* ------------------------------------------------------------------ sidebar */
function Sidebar(props) {
  const { open, onToggle, dock, setDock, onResize, tab, setTab, show, ver, sel, setSel, mode, replies, toastFn, onCopy, collab, cver, presetId, onGoPeer, rec, agentsNav } = props;
  const nPeople = collab ? collab.peers.filter((p) => p.kind === 'viewer').length : 0;
  const errs = show ? show.events.filter((e) => e.kind === 'error').length : 0;
  const busy = show ? [...show.agentStore.values()].some((s) => s.busy) : false;
  if (!open) {
    if (dock === 'bottom') return html`<aside class="side rail bottom" aria-label="Inspector, closed"><button class="rail-btn h" type="button" onClick=${onToggle} aria-label="Open the inspector"><span class="chev">▴</span><span>Inspector</span></button></aside>`;
    return html`<aside class="side rail" aria-label="Inspector, closed"><button class="rail-btn" type="button" onClick=${onToggle} aria-label="Open the inspector"><span class="chev">‹</span><span class="vlab">Graph · Inspect · Agents</span></button>${errs ? html`<span class="rail-badge">${errs}</span>` : null}</aside>`;
  }
  const dockIcon = (d) => html`<svg width="14" height="12" viewBox="0 0 14 12" aria-hidden="true"><rect x=".5" y=".5" width="13" height="11" fill="none" stroke="currentColor" /><rect x=${d === 'right' ? 8.5 : 0.5} y=${d === 'right' ? 0.5 : 7} width=${d === 'right' ? 5 : 13} height=${d === 'right' ? 11 : 4.5} fill="currentColor" /></svg>`;
  let body = null;
  if (tab === 'graph') body = html`<${GraphPanel} show=${show} ver=${ver} sel=${sel} setSel=${setSel} onCopy=${onCopy} />`;
  else if (tab === 'inspect') body = html`<${InspectPanel} show=${show} ver=${ver} sel=${sel} setSel=${setSel} toastFn=${toastFn} />`;
  else if (tab === 'agents') body = html`<${AgentsPanel} show=${show} ver=${ver} mode=${mode} replies=${replies} rec=${rec} nav=${agentsNav} toastFn=${toastFn} />`;
  else if (tab === 'people') body = html`<${PeoplePanel} collab=${collab} cver=${cver} presetId=${presetId} onGo=${onGoPeer} />`;
  else body = html`<${EventsPanel} show=${show} ver=${ver} />`;
  return html`<aside class=${'side ' + dock} aria-label="Inspector">
    <div class=${dock === 'bottom' ? 'resize-y' : 'resize-x'} onPointerDown=${onResize} role="separator" aria-orientation=${dock === 'bottom' ? 'horizontal' : 'vertical'} aria-label="Resize the inspector" title="Drag to resize"></div>
    <div class="side-tabs" role="tablist">
      ${[['graph', 'Graph'], ['inspect', 'Inspect'], ['agents', 'Agents', busy ? '…' : null], ['events', 'Events', errs || null], ['people', 'People', nPeople > 1 ? nPeople : null]].map(([k, l, b]) => html`<button key=${k} type="button" role="tab" aria-selected=${tab === k} class=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${l}${b ? html`<span class=${'badge ' + (k === 'events' ? 'bad' : 'sig')}>${b}</span>` : null}</button>`)}
      <button class="icon-btn" type="button" onClick=${() => setDock(dock === 'right' ? 'bottom' : 'right')} aria-label=${dock === 'right' ? 'Dock the inspector at the bottom' : 'Dock the inspector on the right'} title=${dock === 'right' ? 'Dock at the bottom' : 'Dock on the right'}>${dockIcon(dock === 'right' ? 'bottom' : 'right')}</button>
      <button class="icon-btn" type="button" onClick=${onToggle} aria-label="Close the inspector" title="Close the inspector">${dock === 'bottom' ? '▾' : '›'}</button>
    </div>
    ${body}
  </aside>`;
}

/* ------------------------------------------------------------------ top bar */
function TopBar({ ideOpen, toggleIde, deckTitle, onBuild, status, show, ver, mode, setMode, claude, pick, setPick, present, setPresent, sideOpen, toggleSide, people, presenter, onPeople, onFollowPresenter, userNav }) {
  const idx = show ? show.index : 0, total = show ? show.g.slides.length : 0;
  const steps = show ? show.stepsOf() : 0;
  void ver;
  return html`<header class="top">
    <button class=${'icon-btn ide-toggle' + (ideOpen ? ' on' : '')} type="button" onClick=${toggleIde} aria-pressed=${ideOpen} title=${ideOpen ? 'Close the IDE' : 'Open the IDE'}><span class="bars"><i></i><i></i><i></i></span><span>IDE</span></button>
    <div class="brand"><b>Lattice</b><span>Deck</span><i>IR · DAG</i></div>
    <div class="sep"></div>
    <div class="deck-name" title=${deckTitle}>${deckTitle}</div>
    <div class="grow"></div>
    <button class="btn primary" type="button" onClick=${onBuild} title="Build deck.js (Ctrl Enter)"><span class="tri"></span>Build</button>
    <span class=${'status ' + status.tone}>${status.text}</span>
    <div class="nav" role="group" aria-label="Slides">
      <button type="button" onClick=${() => { if (show) { userNav(); show.prev(); } }} disabled=${!show || (idx === 0 && show.step === 0)} aria-label="Previous">‹</button>
      <span class="readout">${String(idx + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}${steps ? ` · ${show.step}/${steps}` : ''}</span>
      <button type="button" onClick=${() => { if (show) { userNav(); show.next(); } }} disabled=${!show || (idx >= total - 1 && show.step >= steps)} aria-label="Next">›</button>
    </div>
    ${presenter ? html`<button class="btn tiny follow-chip" type="button" style=${{ '--pc': presenter.color }} onClick=${onFollowPresenter}>${presenter.following ? 'Following ' : 'Follow '}${presenter.name}</button>` : null}
    ${people && people.length > 1 ? html`<button class="people-stack" type="button" onClick=${onPeople} title=${people.map((p) => p.name + (p.me ? ' (you)' : '')).join(', ')} aria-label=${people.length + ' people here'}>
      ${people.slice(0, 4).map((p) => html`<${Avatar} key=${p.peer} p=${p} size=${24} />`)}${people.length > 4 ? html`<span class="more">+${people.length - 4}</span>` : null}
    </button>` : null}
    <div class="ctl"><span class="ctl-l">Model</span><${Seg} label="Agent model" value=${mode} set=${setMode} opts=${[['scripted', 'Scripted', 'Agents use the replies file. Free and instant.'], ['claude', 'Claude', 'Agents ask Claude and run what it writes.']]} disabledMap=${{ claude: claude === 'off' ? "Claude isn't available in this view" : claude === 'wait' ? 'Connecting…' : '' }} /></div>
    <button class=${'icon-btn' + (pick ? ' on' : '')} type="button" onClick=${() => setPick(!pick)} aria-pressed=${pick} title="Pick a node on the slide">⌖</button>
    <button class=${'icon-btn' + (present ? ' on' : '')} type="button" onClick=${() => setPresent(!present)} aria-pressed=${present} title=${present ? 'Leave present mode (Esc)' : 'Present: hide the panels'}>▭</button>
    <button class=${'icon-btn' + (sideOpen ? ' on' : '')} type="button" onClick=${toggleSide} aria-pressed=${sideOpen} title=${sideOpen ? 'Close the inspector' : 'Open the inspector'}>▤</button>
  </header>`;
}

/* ------------------------------------------------------------------ app */
function App() {
  const init = useMemo(loadLocal, []);
  const [presetId, setPresetId] = useState(PRESETS.some((p) => p.id === init.presetId) ? init.presetId : DEFAULT_PRESET);
  const [store, setStore] = useState(init.store || {});
  const preset = PRESETS.find((p) => p.id === presetId) || PRESETS[0];
  const files = store[presetId] || preset.files;
  const edited = useMemo(() => { const o = {}; for (const p of PRESETS) { const s = store[p.id]; if (s && (s.deck !== p.files.deck || s.replies !== p.files.replies)) o[p.id] = true; } return o; }, [store]);
  const narrow = () => window.matchMedia && window.matchMedia('(max-width: 900px)').matches;
  const [tab, setTab] = useState(init.tab || 'deck');
  const [ideOpen, setIdeOpen] = useState(init.ideOpen ?? !narrow());
  const [ideW, setIdeW] = useState(init.ideW || 430);
  const [sideOpen, setSideOpen] = useState(init.sideOpen ?? true);
  const [sideDock, setSideDock] = useState(init.sideDock === 'bottom' ? 'bottom' : 'right');
  const [sideW, setSideW] = useState(init.sideW || 400);
  const [sideH, setSideH] = useState(init.sideH || 320);
  const [sideTab, setSideTab] = useState(init.sideTab || 'graph');
  const [auto, setAuto] = useState(init.auto ?? true);
  const [mode, setModeS] = useState('scripted');
  const [claude, setClaude] = useState('wait');
  const [errors, setErrors] = useState([]);
  const [consoleLines, setConsole] = useState([]);
  const [status, setStatus] = useState({ text: 'ready', tone: '' });
  const [sel, setSel] = useState(null);
  const [pick, setPick] = useState(false);
  const [present, setPresent] = useState(false);
  const [toast, setToast] = useState(null);
  const [ver, setVer] = useState(0);
  const [show, setShow] = useState(null);
  const hostRef = useRef();
  const showRef = useRef(null);
  const sampleRef = useRef(null);
  const modeRef = useRef(mode); modeRef.current = mode;
  const agentStoreRef = useRef(new Map());
  const replies = useMemo(() => L.parseReplies(files.replies), [files.replies]);
  const repliesRef = useRef(replies); repliesRef.current = replies;
  const t0 = useRef(performance.now());
  const presetRef = useRef(presetId); presetRef.current = presetId;
  const filesRef = useRef(files); filesRef.current = files;
  const collabRef = useRef(null);
  const [cver, setCver] = useState(0);
  const cbRef = useRef({});
  const [rec, setRec] = useState(null);
  const [agentsNav, setAgentsNav] = useState(null);

  useEffect(() => { saveLocal({ presetId, store, tab, ideOpen, ideW, sideOpen, sideDock, sideW, sideH, sideTab, auto }); }, [presetId, store, tab, ideOpen, ideW, sideOpen, sideDock, sideW, sideH, sideTab, auto]);
  const log = useCallback((level, text) => setConsole((c) => [...c.slice(-250), { level, text, t: performance.now() - t0.current }]), []);
  const flash = useCallback((text, tone = 'ink') => setToast({ text, tone, k: Math.random() }), []);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 3600); return () => clearTimeout(id); }, [toast]);

  /* transcripts: every agent conversation is recorded */
  useEffect(() => {
    const r = new L.Transcripts({
      context: () => ({ preset: presetRef.current, deck: showRef.current ? showRef.current.g.title : null }),
      toast: (t, tone) => flash(t, tone),
    });
    L.transcripts = r;
    L.agent.hooks.record = (key, m, st) => r.record(key, m, st);
    L.agent.hooks.reset = (key, info) => r.reset(key, info);
    setRec(r);
    const hide = () => { if (document.visibilityState === 'hidden') r.flushAll(); };
    document.addEventListener('visibilitychange', hide);
    window.addEventListener('pagehide', hide);
    return () => { document.removeEventListener('visibilitychange', hide); window.removeEventListener('pagehide', hide); };
  }, []);

  /* Claude, when this view can reach it */
  useEffect(() => {
    let alive = true;
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then((s) => { if (!alive) return; sampleRef.current = s; setClaude(s ? 'ready' : 'off'); }).catch(() => alive && setClaude('off'));
    } else setClaude('off');
    return () => { alive = false; };
  }, []);
  const setMode = (m) => { setModeS(m); modeRef.current = m; if (showRef.current) showRef.current.emit('mode', { mode: m }); flash(m === 'claude' ? 'Agents now ask Claude. The first message asks you to allow it.' : 'Agents now use the scripted replies', 'ok'); };

  /* building */
  const bumpRaf = useRef(0);
  const bump = useCallback(() => { if (bumpRaf.current) return; bumpRaf.current = requestAnimationFrame(() => { bumpRaf.current = 0; setVer((v) => v + 1); }); }, []);
  const build = useCallback(async (src, why) => {
    const text = src ?? files.deck;
    setStatus({ text: 'building…', tone: 'busy' });
    const a = performance.now();
    let graph;
    try { graph = await compileDeck(text); }
    catch (e) {
      const err = { file: e.file || 'deck.js', message: e.message || String(e), line: e.line || null };
      setErrors([err]);
      setStatus({ text: 'build failed · the last good build stays up', tone: 'bad' });
      log('error', `${err.file}${err.line ? ':' + err.line : ''} ${err.message}`);
      return false;
    }
    setErrors([]);
    const prev = showRef.current;
    const keep = prev && prev.g.title === graph.title ? { index: prev.index, step: prev.step } : { index: 0, step: 0 };
    if (prev) prev.destroy();
    const host = hostRef.current;
    const nextShow = new L.Show(graph, host, {
      agentStore: agentStoreRef.current,
      mode: () => modeRef.current,
      replies: () => repliesRef.current,
      get sample() { return sampleRef.current; },
      t0: t0.current,
    });
    nextShow.on((e) => {
      if ((e.kind === 'mount' || e.kind === 'step') && collabRef.current) collabRef.current.presence({ slide: nextShow.slide ? nextShow.slide.id : null, idx: nextShow.index, step: nextShow.step, preset: presetRef.current });
      if (e.kind === 'toast') flash(e.text, e.tone);
      else if (e.kind === 'error') log('error', `${e.where}: ${e.message}`);
      else if (e.kind === 'log') log(e.level || '', e.text);
      else if (e.kind === 'eval') log(e.ok ? 'ok' : 'error', `${e.agent} ran code: ${e.ok ? clip(e.value, 140) : e.error}`);
      else if (e.kind === 'restore') log('warn', `Rolled back: ${e.label}`);
      else if (e.kind === 'ui' && e.open === 'transcripts') { setSideOpen(true); setSideTab('agents'); setAgentsNav({ view: 'history', key: e.key, n: Date.now() }); }
      bump();
    });
    showRef.current = nextShow;
    L.current = nextShow;
    nextShow.mount(Math.min(keep.index, graph.slides.length - 1), keep.step);
    setShow(nextShow);
    setSel((s) => (s && graph.nodes.has(s) ? s : null));
    const ms = Math.round(performance.now() - a);
    setStatus({ text: `built in ${ms} ms · ${graph.nodes.size} nodes · ${graph.slides.length} slides`, tone: 'ok' });
    log('ok', `Built "${graph.title}"${why ? ' (' + why + ')' : ''}: ${graph.nodes.size} nodes, ${graph.edges().length} edges, ${graph.warnings.length} warnings, ${ms} ms.`);
    for (const w of graph.warnings.slice(0, 5)) log('warn', `${w.id}: ${w.msg}`);
    bump();
    return true;
  }, [files.deck, log, flash, bump]);

  /* first build, and auto build after edits */
  const first = useRef(true);
  useEffect(() => { if (first.current) { first.current = false; build(files.deck, 'load'); } }, []);
  const lastBuilt = useRef(files.deck);
  useEffect(() => {
    if (!auto || files.deck === lastBuilt.current) return;
    const id = setTimeout(() => { lastBuilt.current = files.deck; build(files.deck, 'auto'); }, 750);
    return () => clearTimeout(id);
  }, [files.deck, auto]);
  const buildNow = () => { lastBuilt.current = files.deck; build(files.deck); };

  /* files and presets */
  const setFile = (k, v, line) => {
    setStore((s) => ({ ...s, [presetId]: { ...(s[presetId] || preset.files), [k]: v } }));
    if (collabRef.current) collabRef.current.localEdit(k, v, line);
  };
  const switchDeck = (id, f, why) => {
    setPresetId(id); setSel(null);
    agentStoreRef.current = new Map();
    if (showRef.current) { showRef.current.destroy(); showRef.current = null; }
    lastBuilt.current = f.deck;
    setTimeout(() => build(f.deck, why), 0);
  };
  const pickPreset = (id) => {
    const p = PRESETS.find((x) => x.id === id);
    const f = store[id] || p.files;
    switchDeck(id, f, 'preset');
    if (collabRef.current) collabRef.current.localPreset(id, f);
  };
  const resetPreset = () => {
    setStore((s) => { const n = { ...s }; delete n[presetId]; return n; });
    lastBuilt.current = preset.files.deck; setTimeout(() => build(preset.files.deck, 'reset'), 0);
    if (collabRef.current) collabRef.current.localPreset(presetId, preset.files);
  };

  /* live sessions: what other people's changes do here */
  cbRef.current = {
    state: () => ({ presetId: presetRef.current, files: { deck: filesRef.current.deck, replies: filesRef.current.replies } }),
    presence: () => { const sh = showRef.current; return { slide: sh && sh.slide ? sh.slide.id : null, idx: sh ? sh.index : 0, step: sh ? sh.step : 0, preset: presetRef.current, sel: sel || null }; },
    adopt: (pid, f, who, reason) => {
      const id = PRESETS.some((x) => x.id === pid) ? pid : presetRef.current;
      const same = id === presetRef.current && f.deck === filesRef.current.deck && f.replies === filesRef.current.replies;
      setStore((s) => ({ ...s, [id]: { deck: f.deck, replies: f.replies } }));
      const name = (PRESETS.find((x) => x.id === id) || preset).name;
      if (reason === 'join') flash(same ? `In a live session with ${who}` : `Joined ${who}'s session: ${name}`, 'ok');
      else flash(`${who} ${reason === 'preset' ? 'opened' : 'synced'} ${name}`, 'ok');
      log('', `Session: ${who} ${reason === 'join' ? 'shared the deck' : reason === 'preset' ? 'opened ' + name : 'resynced the deck'}.`);
      if (same && showRef.current) return;
      if (id !== presetRef.current) switchDeck(id, f, 'session');
      else { lastBuilt.current = f.deck; setTimeout(() => build(f.deck, 'session'), 0); }
    },
    applyFile: (file, text, who, clobbered) => {
      const id = presetRef.current;
      setStore((s) => ({ ...s, [id]: { ...(s[id] || (PRESETS.find((x) => x.id === id) || preset).files), [file]: text } }));
      if (clobbered) flash(`${who}'s edit replaced a change you had not sent yet`, 'warn');
      if (file === 'deck' && !auto) setStatus({ text: `${who} changed deck.js · Build to see it`, tone: 'busy' });
    },
    chat: (key, msg) => {
      const sh = showRef.current; if (!sh) return;
      const st = L.agent.store(sh, key);
      if (msg.reset) { if (st.conv !== msg.conv) st.newChat({ conv: msg.conv, remote: true, from: msg.from }); }
      else st.pushRemote(msg);
    },
    exec: (def, code, who) => {
      const sh = showRef.current; if (!sh) return;
      if (def.kind === 'inspect') {
        const n = def.node && sh.g.get(def.node);
        if (!n) { log('warn', `${who} ran inspector code on ${def.node}, which is not in this build`); return; }
        const h = n.kind === 'deck' ? sh.deckHandle() : sh.handle(n); const sl = sh.g.slideOf(n);
        L.agent.run(sh, code, { ...L.LIB, h, self: h, slide: sl ? sh.handle(sl) : null, deck: sh.deckHandle(), data: sh.g.data, THREE: window.THREE }, `inspector · ${who}`);
        return;
      }
      let d = null;
      if (def.kind === 'deck') d = DECK_AGENT;
      else for (const n of sh.g.nodes.values()) if (n.kind === 'agent' && L.agentDefOf(n).key === def.key) { d = L.agentDefOf(n); break; }
      if (!d) { log('warn', `${who} ran code for ${def.key}, which this build does not have`); return; }
      L.agent.run(sh, code, L.agent.scope(sh, d), `${d.name} · ${who}`);
    },
    follow: (pr) => {
      const sh = showRef.current; if (!sh) return;
      if (pr.preset && pr.preset !== presetRef.current) return;
      let idx = Number.isInteger(pr.idx) ? pr.idx : -1;
      if (typeof pr.slide === 'string') { const j = sh.g.slides.findIndex((x) => x.id === pr.slide); if (j >= 0) idx = j; }
      if (idx < 0 || idx >= sh.g.slides.length) return;
      const st = Number.isInteger(pr.step) ? pr.step : 0;
      if (idx !== sh.index) sh.mount(idx, st); else if (st !== sh.step) sh.setStep(st);
      bump();
    },
    toast: (t, tone) => flash(t, tone),
    log: (t) => log('', t),
  };
  useEffect(() => {
    const c = new L.Collab({
      state: () => cbRef.current.state(), presence: () => cbRef.current.presence(),
      adopt: (...a) => cbRef.current.adopt(...a), applyFile: (...a) => cbRef.current.applyFile(...a),
      chat: (...a) => cbRef.current.chat(...a), exec: (...a) => cbRef.current.exec(...a),
      follow: (...a) => cbRef.current.follow(...a), toast: (...a) => cbRef.current.toast(...a), log: (...a) => cbRef.current.log(...a),
    });
    collabRef.current = c; L.collab = c;
    L.agent.hooks.message = (key, m) => { if (key !== 'inspector') c.chat(key, m); };
    L.agent.hooks.exec = (def, code) => c.exec(def, code);
    const off = c.on(() => setCver((v) => v + 1));
    c.start();
    return () => { off(); };
  }, []);
  useEffect(() => { if (collabRef.current) collabRef.current.presence({ sel: sel || null }); }, [sel]);
  const userNav = () => { const c = collabRef.current; if (c && c.followPeer) c.unfollow(); };

  /* keyboard */
  useEffect(() => {
    const k = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); buildNow(); return; }
      if (e.key === 'Escape') { if (present) setPresent(false); else if (pick) setPick(false); else setSel(null); return; }
      const t = e.target;
      if (t && t.closest && t.closest('input, textarea, select, [contenteditable="true"], .ls-agent')) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === ' ' && t && t.closest && t.closest('button')) return;
      const s = showRef.current;
      if (s && s.handleKey(e)) { e.preventDefault(); userNav(); bump(); }
    };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  });
  useEffect(() => () => { if (showRef.current) showRef.current.destroy(); }, []);

  /* resizing: the IDE and the inspector, by dragging their inner edge */
  const ideW0 = useRef(ideW), sideW0 = useRef(sideW), sideH0 = useRef(sideH);
  const onIdeResize = useDrag(useCallback((dx) => setIdeW(Math.max(300, Math.min(window.innerWidth * 0.6, ideW0.current + dx))), []), null, 'resizing-h');
  const onSideResizeX = useDrag(useCallback((dx) => setSideW(Math.max(300, Math.min(window.innerWidth * 0.6, sideW0.current - dx))), []), null, 'resizing-h');
  const onSideResizeY = useDrag(useCallback((dx, dy) => setSideH(Math.max(160, Math.min(window.innerHeight * 0.75, sideH0.current - dy))), []), null, 'resizing-v');
  const startIde = (e) => { ideW0.current = ideW; onIdeResize(e); };
  const startSide = (e) => { if (sideDock === 'bottom') { sideH0.current = sideH; onSideResizeY(e); } else { sideW0.current = sideW; onSideResizeX(e); } };

  const copyIR = () => {
    const s = showRef.current; if (!s) return;
    const json = JSON.stringify(s.g.toJSON(), null, 1);
    try { navigator.clipboard.writeText(json).then(() => flash(`Copied the IR · ${(json.length / 1024).toFixed(1)} KB of JSON`, 'ok'), () => flash('The clipboard is blocked here', 'warn')); }
    catch (e) { flash('The clipboard is blocked here', 'warn'); }
  };
  const onPickNode = (id) => { setSel(id); setSideTab('inspect'); setSideOpen(true); };
  const selectNode = (id) => {
    setSel(id);
    const s = showRef.current;
    if (!s || !id) return;
    const n = s.g.get(id); const sl = n && s.g.slideOf(n);
    if (sl && sl !== s.slide) s.goTo(sl.id);
  };

  const dims = show ? show.g.dims : [1280, 720];
  const collab = collabRef.current;
  void cver;
  const people = personList(collab, presetId);
  const curSlide = show && show.slide ? show.slide.id : null;
  const stagePeers = people.filter((p) => !p.me && !p.away && p.kind === 'viewer' && p.sameDeck && p.slide === curSlide && !p.idle);
  const peerSlides = new Map();
  for (const p of people) if (!p.me && !p.away && p.kind === 'viewer' && p.sameDeck && p.slide) { if (!peerSlides.has(p.slide)) peerSlides.set(p.slide, []); peerSlides.get(p.slide).push(p); }
  const pres = people.find((p) => p.presenting && !p.me && !p.away && p.sameDeck);
  const presenter = pres ? { ...pres, following: collab && collab.followPeer === pres.peer } : null;
  const lockOf = (file) => { const h = collab && collab.lockFor(file); if (!h) return null; const e = (h.presence && h.presence.edit) || {}; return { name: collab.nameOf(h), color: collab.colorOf(h), line: Number.isInteger(e.line) ? e.line : 0 }; };
  const viewOnly = !!(collab && collab.active && collab.readonly && collab.others().length > 0);
  const goPeer = (p) => { const sh = showRef.current; if (!sh) return; userNav(); const j = sh.g.slides.findIndex((x) => x.id === p.slide); if (j >= 0) { sh.mount(j, p.step || 0); bump(); } };
  const title = `Lattice Deck — ${show ? show.g.title : preset.name}`;
  const sideEl = html`<${Sidebar} open=${sideOpen} onToggle=${() => setSideOpen(!sideOpen)} dock=${sideDock} setDock=${setSideDock} onResize=${startSide}
    tab=${sideTab} setTab=${setSideTab} show=${show} ver=${ver} sel=${sel} setSel=${selectNode} mode=${mode} replies=${replies} toastFn=${flash} onCopy=${copyIR}
    collab=${collab} cver=${cver} presetId=${presetId} onGoPeer=${goPeer} rec=${rec} agentsNav=${agentsNav} />`;
  return html`<div class=${'app' + (ideOpen ? ' ide-open' : '') + ' dock-' + sideDock + (present ? ' present' : '')}
      style=${{ '--ide-w': (ideOpen ? ideW : 40) + 'px', '--side-w': sideOpen ? sideW + 'px' : '40px', '--side-h': sideOpen ? sideH + 'px' : '32px' }}>
    <${TopBar} ideOpen=${ideOpen} toggleIde=${() => setIdeOpen(!ideOpen)} deckTitle=${show ? show.g.title : preset.name} onBuild=${buildNow} status=${status}
      show=${show} ver=${ver} mode=${mode} setMode=${setMode} claude=${claude} pick=${pick} setPick=${setPick} present=${present} setPresent=${setPresent}
      sideOpen=${sideOpen} toggleSide=${() => setSideOpen(!sideOpen)}
      people=${people.filter((p) => p.kind === 'viewer')} presenter=${presenter} onPeople=${() => { setSideOpen(true); setSideTab('people'); }} userNav=${userNav}
      onFollowPresenter=${() => { if (!collab || !presenter) return; if (presenter.following) collab.unfollow(); else collab.follow(presenter.peer); }} />
    <div class="main">
      <${IDE} open=${ideOpen} onToggle=${() => setIdeOpen(!ideOpen)} presetId=${presetId} preset=${preset} files=${files} setFile=${setFile} tab=${tab} setTab=${setTab}
        edited=${edited} onPick=${pickPreset} onReset=${resetPreset} errors=${errors} consoleLines=${consoleLines} clearConsole=${() => setConsole([])}
        onBuild=${buildNow} onResize=${startIde} auto=${auto} setAuto=${setAuto}
        lockOf=${lockOf} viewOnly=${viewOnly} onTakeOver=${(f) => collab && collab.takeOver(f)} onCaret=${(f, line) => collab && collab.caret(f, line)} />
      <div class="center">
        <${Stage} hostRef=${hostRef} dims=${dims} show=${show} ver=${ver} sel=${sel} pick=${pick} onPick=${onPickNode} toast=${toast} title=${title} present=${present}
          peers=${stagePeers} onCursor=${(pt) => collab && collab.live && collab.cursor(pt)} />
        <${Filmstrip} show=${show} ver=${ver} peerSlides=${peerSlides} onGo=${(i) => { if (show) { userNav(); show.mount(i, 0); bump(); } }} />
        ${sideDock === 'bottom' ? sideEl : null}
      </div>
      ${sideDock === 'right' ? sideEl : null}
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();

</script>
