<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lattice Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a drafting table — IDE on the left, the slide as a sheet on a grid in the middle,
   inspector on the right; every panel edge is a ruled line and every label is a stencil. */
:root {
  --paper: #FAFAF8; --sheet: #FFFFFF; --ink: #111417; --on-ink: #FFFFFF; --muted: #5D646A; --faint: #A9AEB2;
  --hair: #B7BCC0; --hair-soft: #E3E6E8; --grid: #EEF0F1; --gridmaj: #E1E4E6;
  --sig: #1F4FD1; --sig-l: #C7D3F4; --sig-w: #EEF2FC; --warn: #9C5F00; --warn-w: #FBF3E4; --bad: #C2361B; --bad-w: #FCEDEA; --ok: #2A7752; --ok-w: #E8F3EC;
  --shadow: rgba(17, 20, 23, .1);
  --body: Arial, "Helvetica Neue", Helvetica, "Liberation Sans", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --dither: radial-gradient(var(--ink) .55px, transparent .75px) 0 0/3px 3px;
  --dither-l: radial-gradient(var(--ink) .5px, transparent .7px) 0 0/4px 4px;
  --hatch: repeating-linear-gradient(45deg, var(--ink) 0 .8px, transparent .8px 3.2px);
  --hatch-l: repeating-linear-gradient(45deg, var(--hair) 0 .8px, transparent .8px 3.2px);
  --hatch-a: repeating-linear-gradient(45deg, var(--warn) 0 .9px, transparent .9px 3px);
  --hatch-r: repeating-linear-gradient(45deg, var(--bad) 0 .9px, transparent .9px 3px);
  --hatch-b: repeating-linear-gradient(45deg, var(--sig) 0 .9px, transparent .9px 3px);
  --hl-c: #7A8086; --hl-s: #2E6B4F; --hl-n: #8A5A00; --hl-f: #14365F;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121518; --sheet: #181C20; --ink: #E3E6E9; --on-ink: #121518; --muted: #98A0A7; --faint: #69727A;
    --hair: #4A5157; --hair-soft: #2A3035; --grid: #1D2226; --gridmaj: #252B30;
    --sig: #86A2F7; --sig-l: #2D3F78; --sig-w: #1B2440; --warn: #E0A23A; --warn-w: #2E2414; --bad: #F07158; --bad-w: #34191A; --ok: #5DBB8B; --ok-w: #17291F;
    --shadow: rgba(0, 0, 0, .35);
    --hl-c: #7F878E; --hl-s: #7FC79F; --hl-n: #E0B067; --hl-f: #A9C2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121518; --sheet: #181C20; --ink: #E3E6E9; --on-ink: #121518; --muted: #98A0A7; --faint: #69727A;
  --hair: #4A5157; --hair-soft: #2A3035; --grid: #1D2226; --gridmaj: #252B30;
  --sig: #86A2F7; --sig-l: #2D3F78; --sig-w: #1B2440; --warn: #E0A23A; --warn-w: #2E2414; --bad: #F07158; --bad-w: #34191A; --ok: #5DBB8B; --ok-w: #17291F;
  --shadow: rgba(0, 0, 0, .35);
  --hl-c: #7F878E; --hl-s: #7FC79F; --hl-n: #E0B067; --hl-f: #A9C2FF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--paper); }
body { color: var(--ink); font: 400 13px/1.45 var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
#root { height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--sig); outline-offset: 1px; }
code, kbd, pre { font-family: var(--mono); }
.muted { color: var(--muted); }
.eyebrow { font: 700 9.5px/1.2 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--sig); font: 600 11px var(--mono); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.link.muted { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- app grid ---------- */
.app { display: grid; grid-template-rows: 46px minmax(0, 1fr); height: 100%; }
.main { display: grid; grid-template-columns: var(--ide-w) minmax(0, 1fr) var(--side-w); min-height: 0; min-width: 0; }
.app.dock-bottom .main { grid-template-columns: var(--ide-w) minmax(0, 1fr); }
.center { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; grid-template-columns: minmax(0, 1fr); min-width: 0; min-height: 0; }
.app.present .main { grid-template-columns: minmax(0, 1fr); }
.app.present .ide, .app.present .side, .app.present .film { display: none; }

/* ---------- buttons ---------- */
.btn { font: 600 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--ink); background: var(--sheet); padding: 8px 11px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover:not(:disabled) { background: var(--grid); }
.btn.primary { background: var(--ink); color: var(--on-ink); }
.btn.primary:hover:not(:disabled) { background: var(--muted); }
.btn.tiny { padding: 5px 8px; font-size: 9.5px; }
.btn .tri { width: 0; height: 0; border-left: 7px solid currentColor; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
.icon-btn { background: var(--sheet); border: 1px solid var(--ink); min-width: 30px; height: 30px; display: inline-grid; place-items: center; font: 600 14px/1 var(--mono); padding: 0 7px; }
.icon-btn:hover { background: var(--grid); }
.icon-btn.on { background: var(--ink); color: var(--on-ink); }
.seg { display: inline-flex; border: 1px solid var(--ink); background: var(--sheet); flex: none; }
.seg button { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 7px 9px; background: transparent; border: 0; border-right: 1px solid var(--ink); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.seg.small button { padding: 5px 7px; font-size: 9.5px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--ink); background: var(--sheet); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.top > * { flex: none; }
.ide-toggle { gap: 7px; display: inline-flex; font: 600 10px var(--mono); letter-spacing: .08em; }
.bars { display: inline-flex; flex-direction: column; gap: 2px; }
.bars i { display: block; width: 11px; height: 1.5px; background: currentColor; }
.brand { display: flex; align-items: baseline; gap: 6px; font: 700 13px/1 var(--body); letter-spacing: -.02em; }
.brand span { font-weight: 400; }
.brand i { font: 500 9px var(--mono); letter-spacing: .06em; color: var(--muted); font-style: normal; border: 1px solid var(--hair); padding: 1px 4px; }
.sep { width: 1px; height: 22px; background: var(--hair); }
.deck-name { font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow { flex: 1 1 auto !important; min-width: 8px; }
.status { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-left: 2px solid var(--hair); padding: 3px 0 3px 7px; min-width: 150px; }
.status.ok { border-color: var(--ok); color: var(--ink); }
.status.bad { border-color: var(--bad); color: var(--bad); }
.status.busy { border-color: var(--sig); }
.nav { display: inline-flex; align-items: center; border: 1px solid var(--ink); background: var(--sheet); }
.nav button { border: 0; background: none; height: 28px; width: 28px; font: 600 14px var(--mono); }
.nav button:hover:not(:disabled) { background: var(--grid); }
.nav .readout { font: 600 10.5px var(--mono); letter-spacing: .04em; padding: 0 8px; border-left: 1px solid var(--ink); border-right: 1px solid var(--ink); height: 28px; display: grid; place-items: center; min-width: 108px; text-align: center; font-variant-numeric: tabular-nums; }
.ctl { display: flex; align-items: center; gap: 6px; }
.ctl-l { font: 700 9px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- panels shared ---------- */
.panel-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--hair-soft); font: 700 9.5px var(--body); letter-spacing: .14em; text-transform: uppercase; }
.panel-h .meta { font: 400 10px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); }
.scroll { flex: 1; min-height: 0; overflow: auto; }
.pad { padding: 12px 14px 30px; }
.empty { color: var(--muted); font-size: 12px; margin: 6px 0; }
h5.sec { margin: 18px 0 6px; font: 700 9.5px var(--body); letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h5.sec:first-child { margin-top: 2px; }
h5.sec .meta { font: 400 10px var(--mono); letter-spacing: 0; text-transform: none; color: var(--muted); }
.resize-x { position: absolute; top: 0; bottom: 0; width: 9px; cursor: col-resize; z-index: 6; touch-action: none; }
.resize-y { position: absolute; left: 0; right: 0; height: 9px; cursor: row-resize; z-index: 6; touch-action: none; }
.resize-x:hover, .resize-x.on { background: linear-gradient(90deg, transparent 3.5px, var(--sig) 3.5px, var(--sig) 5.5px, transparent 5.5px); }
.resize-y:hover, .resize-y.on { background: linear-gradient(180deg, transparent 3.5px, var(--sig) 3.5px, var(--sig) 5.5px, transparent 5.5px); }
body.resizing-h, body.resizing-h * { cursor: col-resize !important; user-select: none; }
body.resizing-v, body.resizing-v * { cursor: row-resize !important; user-select: none; }

/* ---------- IDE ---------- */
.ide { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--sheet); border-right: 1px solid var(--ink); }
.ide .resize-x { right: -5px; }
.rail { align-items: center; padding: 8px 0; gap: 6px; background: var(--paper); }
.rail-btn { border: 1px solid var(--ink); background: var(--sheet); width: 28px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; }
.rail-btn .chev { font: 600 14px/1 var(--mono); }
.vlab { writing-mode: vertical-rl; font: 600 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; max-height: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-badge { background: var(--bad); color: var(--on-ink); font: 600 10px var(--mono); padding: 2px 5px; }
.ide-head { display: flex; align-items: stretch; gap: 8px; padding: 10px 10px 8px 12px; border-bottom: 1px solid var(--hair-soft); }
.preset-btn { flex: 1; text-align: left; background: none; border: 1px solid var(--ink); padding: 7px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.preset-btn:hover { background: var(--grid); }
.pb-name { font: 700 16px/1.15 var(--body); letter-spacing: -.02em; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.pb-name em, .pm-t em { font: 500 9px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--warn); font-style: normal; border: 1px solid var(--warn); padding: 1px 4px; }
.caret { margin-left: auto; font-size: 11px; }
.ide-head .icon-btn { height: auto; }
.ide-desc { padding: 8px 12px 10px; border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.ide-desc p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.preset-menu { position: absolute; z-index: 30; left: 10px; right: 10px; top: 66px; max-height: calc(100% - 80px); overflow: auto; background: var(--sheet); border: 1px solid var(--ink); box-shadow: 5px 5px 0 0 var(--shadow); }
.pm-group { border-bottom: 1px solid var(--hair-soft); }
.pm-h { font: 700 9.5px var(--body); letter-spacing: .16em; text-transform: uppercase; padding: 10px 12px 4px; color: var(--muted); }
.pm-item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 7px 12px 8px 10px; }
.pm-item:hover { background: var(--grid); }
.pm-item.on { border-left-color: var(--sig); background: var(--sig-w); }
.pm-n { font: 500 10px/1.6 var(--mono); color: var(--sig); }
.pm-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pm-t b { font: 700 13px/1.3 var(--body); }
.pm-t span { font-size: 11.5px; line-height: 1.4; color: var(--muted); }
.cx { display: inline-flex; gap: 2px; margin-top: 4px; }
.cx i { width: 6px; height: 6px; border: 1px solid var(--ink); display: inline-block; }
.cx i.f { background: var(--ink); }
.tabs { display: flex; border-bottom: 1px solid var(--ink); background: var(--paper); overflow-x: auto; align-items: stretch; }
.tab { font: 600 10.5px/1 var(--mono); letter-spacing: .04em; padding: 9px 12px 8px; background: none; border: 0; border-right: 1px solid var(--hair-soft); white-space: nowrap; color: var(--muted); }
.tab.on { background: var(--sheet); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.tabs .spacer { flex: 1; }
.tabs label.auto { display: flex; align-items: center; gap: 5px; font: 500 10.5px var(--mono); color: var(--muted); padding: 0 10px; white-space: nowrap; cursor: pointer; }
.tabs label.auto input { accent-color: var(--sig); margin: 0; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 6px; vertical-align: 1px; background: var(--bad); }
.ide-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.code { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--sheet); --g: 42px; }
.code .gutter { position: absolute; left: 0; top: 0; width: var(--g); margin: 0; padding: 10px 8px 0 0; text-align: right; font: 400 11px/1.65 var(--mono); color: var(--faint); border-right: 1px solid var(--hair-soft); min-height: 100%; background: var(--paper); user-select: none; }
.code .gutter b { color: var(--bad); font-weight: 600; }
.code-view { position: absolute; left: var(--g); right: 0; top: 0; bottom: 0; overflow: hidden; pointer-events: none; }
.code .hl, .code textarea { font: 400 12px/1.65 var(--mono); tab-size: 2; letter-spacing: 0; padding: 10px 14px 40px; margin: 0; white-space: pre; word-wrap: normal; }
.code .hl { position: absolute; left: 0; top: 0; min-width: 100%; color: var(--ink); }
.code textarea { position: absolute; left: var(--g); top: 0; right: 0; bottom: 0; width: calc(100% - var(--g)); height: 100%; border: 0; outline: none; resize: none; background: transparent; color: transparent; caret-color: var(--ink); overflow: auto; }
.code textarea::selection { background: rgba(31, 79, 209, .22); }
.hl-c { color: var(--hl-c); font-style: italic; }
.hl-s { color: var(--hl-s); }
.hl-n { color: var(--hl-n); }
.hl-k { font-weight: 600; }
.hl-b { color: var(--sig); font-weight: 600; }
.hl-f { color: var(--hl-f); }
.hl-rh { background: var(--ink); color: var(--on-ink); font-weight: 600; }
.hl-rp { color: var(--sig); font-weight: 600; }
.hl-rt { color: var(--muted); }
.errors { border-top: 1px solid var(--bad); background: var(--bad-w); max-height: 130px; overflow: auto; flex: none; }
.err { padding: 6px 12px; font: 400 11.5px/1.45 var(--mono); color: var(--bad); border-bottom: 1px solid var(--hair-soft); }
.err b { font-weight: 600; margin-right: 6px; }
.console { border-top: 1px solid var(--ink); height: 128px; display: flex; flex-direction: column; flex: none; }
.console-body { flex: 1; overflow: auto; padding: 4px 0; font: 400 11px/1.5 var(--mono); }
.cl { padding: 1px 12px; border-left: 2px solid transparent; white-space: pre-wrap; word-break: break-word; }
.cl.error { color: var(--bad); border-left-color: var(--bad); }
.cl.ok { border-left-color: var(--ok); }
.cl.warn { border-left-color: var(--warn); }
.cl .ct { color: var(--faint); margin-right: 8px; }
.ref { overflow: auto; padding: 14px 14px 30px; font-size: 12px; }
.ref-lede { margin: 0 0 12px; line-height: 1.5; color: var(--muted); font-size: 12.5px; max-width: 62ch; }
.ref section { margin-top: 16px; }
.ref h4 { margin: 0 0 6px; font: 700 9.5px var(--body); letter-spacing: .16em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 5px; }
.ref table { border-collapse: collapse; width: 100%; }
.ref td { vertical-align: top; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--hair-soft); line-height: 1.45; }
.ref td:first-child { width: 52%; }
.ref code { font: 500 11px/1.45 var(--mono); color: var(--sig); word-break: break-word; }
kbd { border: 1px solid var(--hair); padding: 0 4px; font-size: 10.5px; background: var(--paper); }

/* ---------- stage ---------- */
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--paper); }
.sheet-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--grid) .5px, transparent .5px), linear-gradient(90deg, var(--grid) .5px, transparent .5px), linear-gradient(var(--gridmaj) .6px, transparent .6px), linear-gradient(90deg, var(--gridmaj) .6px, transparent .6px); background-size: 12px 12px, 12px 12px, 48px 48px, 48px 48px; pointer-events: none; }
.slide-frame { position: absolute; transform-origin: 0 0; }
.slide-frame::before { content: ""; position: absolute; left: 6px; top: 6px; right: -6px; bottom: -6px; background: var(--hatch-l); z-index: 0; }
.slide-host { position: relative; z-index: 1; outline: 1px solid var(--ink); }
.regmark { position: absolute; width: 18px; height: 18px; pointer-events: none; }
.regmark::before, .regmark::after { content: ""; position: absolute; background: var(--ink); }
.regmark::before { left: 8.5px; top: 0; width: 1px; height: 18px; }
.regmark::after { top: 8.5px; left: 0; height: 1px; width: 18px; }
.regmark i { position: absolute; left: 4px; top: 4px; width: 10px; height: 10px; border: 1px solid var(--ink); border-radius: 50%; }
.dim { position: absolute; font: 500 9px var(--mono); letter-spacing: .06em; color: var(--muted); pointer-events: none; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.dim.h::before, .dim.h::after { content: ""; height: 1px; flex: 1; background: var(--hair); }
.hud { position: absolute; z-index: 5; display: flex; gap: 8px; align-items: flex-start; }
.hud.tl { left: 10px; top: 10px; }
.hud.br { right: 10px; bottom: 10px; }
.titleblock { background: var(--sheet); border: 1px solid var(--ink); min-width: 280px; max-width: 420px; }
.titleblock .tb1 { font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titleblock .tb2 { display: grid; grid-template-columns: repeat(3, auto); }
.titleblock .tb2 span { font: 400 9.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 4px 8px; border-right: 1px solid var(--hair-soft); white-space: nowrap; }
.titleblock .tb2 span:last-child { border-right: 0; }
.titleblock .tb2 b { color: var(--ink); font-weight: 600; }
.sel-box { position: absolute; pointer-events: none; z-index: 4; }
.sel-box .c { position: absolute; width: 9px; height: 9px; border-color: var(--sig); border-style: solid; border-width: 0; }
.sel-box .c.a { left: -4px; top: -4px; border-left-width: 1.5px; border-top-width: 1.5px; }
.sel-box .c.b { right: -4px; top: -4px; border-right-width: 1.5px; border-top-width: 1.5px; }
.sel-box .c.c2 { right: -4px; bottom: -4px; border-right-width: 1.5px; border-bottom-width: 1.5px; }
.sel-box .c.d { left: -4px; bottom: -4px; border-left-width: 1.5px; border-bottom-width: 1.5px; }
.sel-box .lab { position: absolute; left: -4px; top: -20px; background: var(--sig); color: var(--on-ink); font: 600 9.5px var(--mono); padding: 2px 5px; white-space: nowrap; }
.sel-box.hover { outline: 1px dashed var(--sig); outline-offset: 2px; }
.stage.picking .slide-host, .stage.picking .slide-host * { cursor: crosshair !important; }
.toast { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); font: 600 11px var(--mono); letter-spacing: .04em; padding: 8px 12px; border-left: 4px solid var(--sig); animation: toast .25s ease-out; z-index: 20; pointer-events: none; max-width: 70%; }
.toast.bad { border-left-color: var(--bad); } .toast.ok { border-left-color: var(--ok); } .toast.warn { border-left-color: var(--warn); }
@keyframes toast { from { opacity: 0; transform: translate(-50%, -6px); } }
.stage-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 500 12px var(--mono); }

/* ---------- filmstrip ---------- */
.film { border-top: 1px solid var(--ink); background: var(--sheet); display: flex; min-width: 0; }
.film-ctl { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 8px 10px; border-right: 1px solid var(--hair-soft); flex: none; }
.pips { display: flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border: 1px solid var(--ink); display: inline-block; }
.pips i.on { background: var(--ink); }
.film-strip { display: flex; gap: 8px; padding: 8px 10px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: thin; }
.tile { flex: none; width: 150px; height: 74px; border: 1px solid var(--hair); background: var(--sheet); text-align: left; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; position: relative; }
.tile:hover { border-color: var(--ink); }
.tile.on { border-color: var(--sig); box-shadow: inset 0 0 0 1px var(--sig); background: var(--sig-w); }
.tile .tn { font: 600 9.5px var(--mono); letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; }
.tile.on .tn { color: var(--sig); }
.tile .tt { font: 700 11.5px/1.25 var(--body); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile .tk { margin-top: auto; display: flex; gap: 3px; flex-wrap: nowrap; overflow: hidden; }
.kchip { font: 600 8.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 1px 3px; border: 1px solid var(--ink); white-space: nowrap; }
.kchip.k3d { background: var(--dither-l); }
.kchip.kagent { border-color: var(--sig); color: var(--sig); }
.kchip.kchart, .kchip.ksvg { background: var(--hatch-l); }

/* ---------- sidebar ---------- */
.side { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--sheet); border-left: 1px solid var(--ink); }
.side .resize-x { left: -5px; }
.side.bottom { height: var(--side-h); border-left: 0; border-top: 1px solid var(--ink); }
.side.bottom .resize-y { top: -5px; }
.side.rail.bottom { height: 32px; flex-direction: row; padding: 0 10px; }
.rail-btn.h { flex-direction: row; width: auto; padding: 4px 10px; gap: 8px; font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.side-tabs { display: flex; border-bottom: 1px solid var(--ink); background: var(--paper); }
.side-tabs > button[role="tab"] { flex: 1; font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 11px 6px 10px; background: none; border: 0; border-right: 1px solid var(--hair-soft); color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.side-tabs > button.on { background: var(--sheet); color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.side-tabs .icon-btn { border: 0; border-left: 1px solid var(--hair-soft); height: auto; background: none; color: var(--muted); }
.badge { font: 600 9px/1 var(--mono); padding: 2px 4px; background: var(--ink); color: var(--on-ink); }
.badge.bad { background: var(--bad); }
.badge.sig { background: var(--sig); }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.subbar { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--hair-soft); flex-wrap: wrap; }
.subbar .meta { font: 400 10px var(--mono); color: var(--muted); margin-left: auto; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--ink); }
.stats div { padding: 6px 8px; border-right: 1px solid var(--hair-soft); border-bottom: 1px solid var(--hair-soft); display: flex; flex-direction: column; }
.stats div:nth-child(4n) { border-right: 0; }
.stats div:nth-last-child(-n+4) { border-bottom: 0; }
.stats b { font: 500 17px/1.1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stats span { font: 700 8.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
ol.passes { list-style: none; margin: 0; padding: 0; counter-reset: p; }
ol.passes li { display: grid; grid-template-columns: 22px 92px minmax(0, 1fr) auto; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--grid); font: 400 11px/1.4 var(--mono); align-items: baseline; }
ol.passes li::before { counter-increment: p; content: counter(p, decimal-leading-zero); color: var(--sig); font-size: 10px; }
ol.passes b { font-weight: 600; }
ol.passes .ms { color: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums; }
.dag { position: relative; border: 1px solid var(--ink); background: var(--paper); overflow: hidden; }
.dag svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dag .dn { position: absolute; height: 20px; display: flex; align-items: center; gap: 4px; padding: 0 5px; font: 500 10px var(--mono); background: var(--sheet); border: 1px solid var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dag .dn.src { border-style: dashed; color: var(--muted); }
.dag .dn.sig { border-radius: 10px; background: var(--sig-w); border-color: var(--sig); color: var(--ink); }
.dag .dn.der { border-radius: 10px; background: var(--hatch-b), var(--sheet); border-color: var(--sig); }
.dag .dn.der span { background: var(--sheet); padding: 0 2px; }
.dag .dn.tgt { cursor: pointer; }
.dag .dn.tgt:hover, .dag .dn.on { border-color: var(--sig); box-shadow: inset 0 0 0 1px var(--sig); }
.dag .colh { position: absolute; top: 6px; font: 700 8.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.dag path { fill: none; stroke-width: 1; }
.dag path.live { stroke: var(--sig); }
.dag path.build { stroke: var(--muted); stroke-dasharray: 3 2; }
.dag path.sig { stroke: var(--ink); }
.dag path.run { stroke: var(--ok); stroke-dasharray: 1 2.5; stroke-width: 1.4; stroke-linecap: round; }
.dag path.hot { stroke-width: 2.2; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 400 10px var(--mono); color: var(--muted); margin-top: 6px; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 16px; height: 0; border-top: 1.5px solid var(--ink); display: inline-block; }
.legend i.live { border-color: var(--sig); }
.legend i.build { border-top-style: dashed; border-color: var(--muted); }
.legend i.run { border-top-style: dotted; border-color: var(--ok); border-top-width: 2px; }
.tree { font: 400 11px/1.55 var(--mono); }
.tree .tr { display: flex; gap: 6px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 0 4px; white-space: nowrap; }
.tree .tr:hover { background: var(--grid); }
.tree .tr.on { background: var(--sig-w); box-shadow: inset 2px 0 0 var(--sig); }
.tree .pf { color: var(--faint); white-space: pre; }
.tree .lb { font-weight: 600; }
.tree .sm { color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tag { font: 600 8.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 0 3px; border: 1px solid var(--ink); flex: none; }
.tag.live { border-color: var(--sig); color: var(--sig); }
.tag.build { border-color: var(--muted); color: var(--muted); border-style: dashed; }
.tag.sig { background: var(--sig-w); border-color: var(--sig); }
.tag.on, .tag.frame, .tag.effect { background: var(--hatch-l); }
.ent-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px 10px; border-bottom: 1px solid var(--hair-soft); }
.ent-t { min-width: 0; flex: 1; }
.ent-name { font: 700 18px/1.15 var(--body); letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; word-break: break-all; }
.rchip { font: 500 9.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--ink); padding: 1px 5px; }
.ent-meta { font: 400 10.5px var(--mono); color: var(--muted); margin-top: 2px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 12px; }
.tbl th { text-align: left; font: 700 9px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 7px 8px 5px 0; border-bottom: 1px solid var(--ink); }
.tbl td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--hair-soft); vertical-align: top; }
.tbl td.k { font: 600 11px var(--mono); width: 92px; word-break: break-word; }
.tbl td.v { font: 400 11px/1.45 var(--mono); word-break: break-word; min-width: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover { background: var(--grid); }
pre.snip, pre.val { margin: 4px 0 2px; padding: 6px 8px; background: var(--paper); border: 1px solid var(--hair-soft); font: 400 11px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
pre.snip { border-left: 2px solid var(--sig); }
.deps { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.deps code { font: 500 10px var(--mono); border: 1px solid var(--hair); padding: 0 4px; }
.handle-path { display: flex; gap: 6px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--hair-soft); }
.handle-path code { flex: 1; min-width: 0; font: 500 11px var(--mono); color: var(--sig); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repl { display: flex; flex-direction: column; gap: 6px; }
.repl textarea { width: 100%; min-height: 54px; resize: vertical; border: 1px solid var(--ink); background: var(--sheet); padding: 6px 8px; font: 400 11.5px/1.5 var(--mono); }
.repl .row { display: flex; gap: 8px; align-items: center; }
.res { font: 400 11px/1.45 var(--mono); padding: 5px 8px; border-left: 2px solid var(--ok); background: var(--ok-w); white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
.res.bad { border-left-color: var(--bad); background: var(--bad-w); color: var(--bad); }

/* events */
.evlist { padding: 4px 0 20px; }
.ev { display: grid; grid-template-columns: 52px 62px minmax(0, 1fr); gap: 6px; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; padding: 3px 10px; font: 400 11px/1.45 var(--mono); }
.ev .m { color: var(--faint); font-variant-numeric: tabular-nums; }
.ev .kd { font-weight: 600; text-transform: uppercase; font-size: 9.5px; letter-spacing: .04em; }
.ev .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev.error { color: var(--bad); border-left-color: var(--bad); }
.ev.patch { border-left-color: var(--sig); }
.ev.eval { border-left-color: var(--ok); }
.ev.eval.bad { border-left-color: var(--bad); }
.ev.signal .kd { color: var(--sig); }

/* agents (sidebar) */
.agent-pick { display: flex; gap: 4px; flex-wrap: wrap; }
.chat { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.chat-log { flex: 1; min-height: 0; overflow: auto; padding: 8px 0 16px; }
.msg { padding: 6px 14px 7px; border-bottom: 1px solid var(--grid); font-size: 12.5px; line-height: 1.45; position: relative; }
.msg .who { font: 700 9.5px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.msg.user { border-left: 3px solid var(--ink); background: var(--paper); }
.msg.agent { border-left: 3px solid var(--sig); }
.msg.code { border-left: 3px solid var(--sig-l); }
.msg.result { border-left: 3px solid var(--ok); font: 400 11px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; }
.msg.result.bad, .msg.error { border-left-color: var(--bad); background: var(--bad-w); color: var(--bad); }
.msg.note { color: var(--muted); font-style: italic; }
.chat-sug { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--ink); background: var(--sheet); padding: 3px 8px; font: 500 11px var(--mono); text-align: left; }
.chip:hover { background: var(--grid); }
.chip.on { background: var(--ink); color: var(--on-ink); }
.chat-in { display: flex; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid var(--hair-soft); }
.chat-in input { flex: 1; min-width: 0; border: 1px solid var(--ink); background: var(--sheet); padding: 7px 9px; font: 400 12.5px var(--body); }
.thinking { font: 500 10px var(--mono); color: var(--sig); padding: 4px 14px; letter-spacing: .06em; text-transform: uppercase; }
.msg.result.warn { border-left-color: var(--warn); background: var(--warn-w); }
.msg.error.runtime { background: var(--bad-w); border-left-style: double; border-left-width: 4px; }
.res-mark { font-weight: 700; }
.res-mark.ok { color: var(--ok); } .res-mark.bad { color: var(--bad); } .res-mark.warn { color: var(--warn); }
.res-logs { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--hair-soft); color: var(--ink); }
.res-errs { margin: 4px 0 0; padding: 0 0 0 16px; color: var(--bad); }
.res-errs li { margin: 1px 0; }
.res.warn { border-left-color: var(--warn); background: var(--warn-w); }
.chat-in input:disabled { opacity: .6; }

/* transcripts */
.tr-log, .tr-view { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.tr-log .scroll, .tr-view .scroll { flex: 1; min-height: 0; overflow: auto; }
select.sel { border: 1px solid var(--ink); background: var(--sheet); color: var(--ink); font: 500 11px var(--mono); padding: 4px 6px; max-width: 220px; }
.subbar label.check { padding: 0; align-items: center; font: 500 11px var(--mono); }
.subbar label.check input { margin-top: 0; }
.subbar .grow { flex: 1; }
.tr-where { margin: 0; padding: 6px 12px; font: 400 10.5px/1.45 var(--mono); color: var(--muted); border-bottom: 1px solid var(--hair-soft); background: var(--paper); }
.tr-row { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--grid); padding: 9px 12px; color: var(--ink); }
.tr-row:hover { background: var(--grid); }
.tr-row.bad { box-shadow: inset 3px 0 0 var(--bad); }
.tr-dot { width: 8px; height: 8px; flex: none; margin-top: 4px; border: 1.5px solid var(--ok); background: var(--ok); }
.tr-dot.open { background: transparent; border-color: var(--sig); }
.tr-dot.bad { background: var(--bad); border-color: var(--bad); }
.tr-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.tr-h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.tr-h .rchip { font-size: 8.5px; }
.tr-p { font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-m { font: 400 10px var(--mono); color: var(--muted); }
.tr-m b.bad { color: var(--bad); font-weight: 600; } .tr-m b.warn { color: var(--warn); font-weight: 600; }
.tr-title { font-size: 12.5px; }
.tr-sum { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 7px 12px; font: 400 10.5px var(--mono); color: var(--muted); border-bottom: 1px solid var(--hair-soft); background: var(--paper); align-items: center; }
.tr-sum code { color: var(--ink); }
.tr-sum label.check { padding: 0; margin-left: auto; align-items: center; color: var(--ink); }
.tr-sum label.check input { margin-top: 0; }
.tr-turn { padding: 5px 14px; font: 500 10px var(--mono); letter-spacing: .03em; color: var(--muted); background: var(--grid); border-bottom: 1px solid var(--hair-soft); }
.tr-turn.bad { color: var(--bad); background: var(--bad-w); }
.tr-turn.warnish { color: var(--warn); }
.tr-sys, .msg details { padding: 4px 14px; font: 500 10.5px var(--mono); color: var(--muted); border-bottom: 1px solid var(--grid); }
.msg details { padding: 4px 0 0; border: 0; }
.tr-sys summary, .msg details summary { cursor: pointer; }
.tr-sys pre.snip, .msg details pre.snip { max-height: 260px; overflow: auto; white-space: pre-wrap; }
.tr-json { margin: 0 12px 8px; height: 140px; border: 1px solid var(--ink); background: var(--sheet); color: var(--ink); font: 400 10.5px/1.4 var(--mono); padding: 6px; resize: vertical; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font: 500 10.5px var(--mono); color: var(--bad); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.bad:hover:not(:disabled) { background: var(--bad-w); }
.empty.bad { color: var(--bad); }

/* ==========================================================================
   inside the slide (themed by the deck, not by the app)
   ========================================================================== */
.ls-slide { position: relative; padding: 52px 68px 30px; display: flex; flex-direction: column; gap: 20px; background: var(--s-bg); color: var(--s-fg); font: 400 24px/1.42 var(--s-body); overflow: hidden; text-align: left; }
.ls-slide * { box-sizing: border-box; }
.ls-head { display: flex; flex-direction: column; gap: 8px; flex: none; }
.ls-title { margin: 0; font-family: var(--s-display); font-weight: 800; font-size: 52px; line-height: 1.04; font-stretch: 112%; letter-spacing: -.022em; text-wrap: balance; }
.ls-sub { margin: 0; font-size: 21px; line-height: 1.4; color: var(--s-muted); max-width: 62ch; }
.ls-head:has(.ls-title[hidden]):has(.ls-sub[hidden]) { display: none; }
.ls-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; }
.ls-layout-center { align-items: center; justify-content: center; text-align: center; }
.ls-layout-center .ls-stack, .ls-layout-center .ls-row { align-items: center; }
.ls-layout-center > .ls-scene, .ls-layout-center > .ls-chart, .ls-layout-center > .ls-svg, .ls-layout-center > .ls-svgraw, .ls-layout-center > .ls-agent { align-self: stretch; }
.ls-layout-split { display: grid; gap: 36px; align-items: stretch; }
.ls-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; min-height: 0; }
.ls-foot { display: flex; justify-content: space-between; gap: 16px; flex: none; font: 500 12px var(--s-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--s-muted); border-top: 1px solid var(--s-line); padding-top: 9px; font-variant-numeric: tabular-nums; }
.ls-text { min-width: 0; }
.ls-text code, .ls-bullets code, .ls-callout code, .ls-title code { font-family: var(--s-mono); font-size: .86em; background: color-mix(in srgb, var(--s-brand) 10%, var(--s-bg)); padding: 0 .25em; }
.ls-mono { font-family: var(--s-mono); letter-spacing: -.01em; }
.ls-heading { margin: 0; font: 700 30px/1.15 var(--s-display); font-stretch: 108%; }
.ls-bullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.ls-bullets li { position: relative; padding-left: 30px; }
.ls-bullets li::before { content: ""; position: absolute; left: 4px; top: .55em; width: 11px; height: 11px; background: var(--s-brand); }
.ls-callout { display: flex; gap: 14px; align-items: baseline; padding: 14px 18px; border: 1.5px solid var(--s-fg); background: var(--s-bg); }
.ls-callout-k { font: 700 13px var(--s-mono); letter-spacing: .1em; padding: 2px 6px; background: var(--s-fg); color: var(--s-bg); flex: none; }
.ls-callout[data-variant="warning"] { border-color: var(--s-amber); }
.ls-callout[data-variant="warning"] .ls-callout-k { background: var(--s-amber); }
.ls-callout[data-variant="danger"] { border-color: var(--s-red); }
.ls-callout[data-variant="danger"] .ls-callout-k { background: var(--s-red); }
.ls-callout[data-variant="tip"] .ls-callout-k, .ls-callout[data-variant="info"] .ls-callout-k { background: var(--s-brand); }
.ls-code { margin: 0; padding: 16px 20px; background: var(--s-subtle); border: 1px solid var(--s-line); font: 400 17px/1.55 var(--s-mono); white-space: pre; overflow: hidden; }
.ls-code .hl-c { color: var(--s-muted); }
.ls-code .hl-s { color: var(--s-green); }
.ls-code .hl-n { color: var(--s-amber); }
.ls-code .hl-b, .ls-code .hl-f { color: var(--s-brand); }
.ls-stat { display: flex; flex-direction: column; gap: 4px; padding: 18px 0 14px; border-top: 2px solid var(--s-fg); }
.ls-stat-v { font: 800 72px/1 var(--s-display); font-stretch: 105%; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ls-stat-l { font-size: 19px; color: var(--s-muted); }
.ls-stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ls-row { display: flex; flex-direction: row; gap: 20px; align-items: stretch; min-width: 0; }
.ls-grid { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ls-comp { display: contents; }
.ls-spacer { flex: 1; }
.ls-divider { border: 0; border-top: 1px solid var(--s-line); margin: 0; width: 100%; }
.ls-error { font: 500 15px var(--s-mono); color: var(--s-red); border: 1.5px dashed var(--s-red); padding: 10px 14px; }
.ls-btn { font: 600 17px var(--s-mono); letter-spacing: .04em; padding: 10px 18px; background: var(--s-bg); color: var(--s-fg); border: 1.5px solid var(--s-fg); cursor: pointer; }
.ls-btn:hover { background: var(--s-fg); color: var(--s-bg); }
.ls-btn:active { transform: translateY(1px); }
.ls-slider { display: flex; flex-direction: column; gap: 8px; min-width: 200px; }
.ls-slider-top { display: flex; justify-content: space-between; gap: 12px; font: 600 14px var(--s-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--s-muted); }

// A component is a function from props to a builder subtree.
// It keeps its name in the IR: try the selector Card[accent] in the Inspect tab.

    .add(text(title).size('lg').weight(700))
    .add(text(body).color('muted')));

  .slide('shipped', s => s

    .add(TwoUp(

  .slide('numbers', s => s
    .title('By the numbers')
    .add(grid(3).gap(28).add(
      stat('3.2×', 'faster cold open'),
      stat('41%', 'fewer sync conflicts'),

##### build
name: Build-time lambdas
group: Basics
desc: A bare lambda in a value slot runs once while building, with a ctx that knows the slide index, the slide count and the deck's data. The footer needs the total, so it resolves after every slide exists.
--- deck.js
// ctx => …  runs at build time; its result is baked into the IR.
// Graph → Passes shows "resolve: N build lambdas". The DAG shows what each one read.
const releases = [
  { version: '2.4.0', date: '2026-10-02', breaking: 2, highlights: ['Signals can derive from other signals', 'Charts lower to SVG at mount', 'New blueprint theme', 'Agents checkpoint and roll back on errors', 'Shared 3D geometry and materials', 'Keyboard shortcuts for steps', 'Faster IR diffing'] },
  { version: '2.3.0', date: '2026-09-11', breaking: 0, highlights: ['Timelines can be scrubbed by a signal', 'Slide notes', 'Footer lambdas'] },
  { version: '2.2.0', date: '2026-08-20', breaking: 1, highlights: ['defineKind for custom node kinds', 'Live SVG attributes'] },
];

return deck('Release Notes')
  .data('releases', releases)
  .defaults(s => s.footer(ctx => `Release notes · ${ctx.index + 1} of ${ctx.total}`))
  .slide('cover', s => s
    .title('Release notes')
    .subtitle(ctx => `${ctx.data('releases').length} releases since ${ctx.data('releases').at(-1).date}`)
    .add(text(ctx => `${ctx.data('releases').reduce((n, r) => n + r.highlights.length, 0)} changes in total`).size('xl').color('muted')))
  .each(releases, (d, r, i) => d
    .slide(`rel-${i}`, s => s
      .title(`v${r.version}`)
      .subtitle(r.date)
      .when(r.breaking > 0, s => s.callout('warning', `${r.breaking} breaking change${r.breaking > 1 ? 's' : ''}. Read the migration notes first.`))
      .bullets(r.highlights.slice(0, 5))
      .when(r.highlights.length > 5, s => s.notes(`Also: ${r.highlights.slice(5).join('; ')}`))));

##### state
name: Signals and events
group: Runtime
desc: Signals hold runtime state. live($ => …) lambdas re-run when the signals they read change; derive() builds signals from signals. The DAG in the Graph tab shows every edge.
--- deck.js
// s.sig(name, init)        a runtime signal (a node in the DAG)
// s.derive(name, $ => …)   a signal computed from others
// live($ => …)             a prop that re-runs when what it reads changes
// .on('click', $ => …)     an event handler; $.set(sig, v | fn) writes
return deck('Pricing')
  .slide('pricing', s => {
    const seats = s.sig('seats', 25);
    const plan = s.sig('plan', 'team');
    const price = s.derive('price', $ => ({ team: 12, pro: 29 })[$(plan)] * $(seats));
    s.title('Pricing calculator')
     .subtitle('Drag the slider, pick a plan, or press ↑ and ↓')
     .add(row().gap(36).align('end')
        .add(slider(seats, { min: 1, max: 500, label: 'Seats' }).grow())
        .add(toggle(['team', 'pro']).bind(plan)))
     .add(text(live($ => `$${$(price).toLocaleString()} / month`)).size('5xl').weight(800))
     .add(text(live($ => `${$(seats)} seats on ${$(plan)} at $${({ team: 12, pro: 29 })[$(plan)]} each`)).color('muted'))
     .add(callout('note', 'Over 200 seats? Volume pricing applies; talk to sales.').visible(live($ => $(seats) > 200)))
     .on('key:ArrowUp', $ => $.set(seats, n => Math.min(500, n + 10)))
     .on('key:ArrowDown', $ => $.set(seats, n => Math.max(1, n - 10)));
  })
  .slide('counter', s => {
    const n = s.sig('n', 3);
    const sq = s.derive('sq', $ => $(n) * $(n));
    s.title('Events write, lambdas read')
     .add(text(live($ => `n = ${$(n)}   n² = ${$(sq)}`)).size('4xl').weight(800).mono())
     .add(row().gap(12)
        .add(button('−1').on('click', $ => $.set(n, v => v - 1)))
        .add(button('+1').on('click', $ => $.set(n, v => v + 1)))
        .add(button('Reset').on('click', $ => $.set(n, 3))))
     .add(text(live($ => `This slide has been open for ${$.t.toFixed(1)} s. Reading $.t makes a lambda run every frame.`)).color('muted'));

// These lambdas run while building. Graph → Passes reports the baked vertex count.
const noise = (x, z) => Math.sin(x * 0.11) * Math.cos(z * 0.13) * 1.4 + Math.sin(x * 0.31 + z * 0.17) * 0.45 + Math.cos(z * 0.47 - x * 0.07) * 0.2;
const terrain = geo.heightfield(128, 128, (x, z) => noise(x, z), { size: [12, 12] });
const shell = geo.parametric((u, v) => {
  const a = u * Math.PI * 6, r = 0.08 + u * 0.85, b = v * Math.PI * 2;
  return [Math.cos(a) * r * (1 + 0.45 * Math.cos(b)), u * 2.4 + r * 0.45 * Math.sin(b), Math.sin(a) * r * (1 + 0.45 * Math.cos(b))];
}, { segments: [180, 24] });

// A recursive component: each Branch adds three smaller Branches at its tip.
const Branch = component('Branch', ({ depth, len }) =>
  group()
    .add(mesh(geo.cylinder(0.03 * depth, 0.045 * depth, len, 8)).pos(0, len / 2, 0).mat('bark').castShadow())
    .when(depth === 1, g => g.add(mesh(geo.icosahedron(0.16, 0)).pos(0, len, 0).mat('leaf')))
    .when(depth > 1, g => g.add(...[0, 1, 2].map(k => {
      const a = (k / 3) * Math.PI * 2 + depth;
      return Branch({ depth: depth - 1, len: len * 0.74 }).pos(0, len, 0).rot(Math.cos(a) * 34, 0, Math.sin(a) * 34);
    }))));

const cells = [];
for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) cells.push({ x: i - 3, z: j - 3, value: Math.round(18 + 62 * Math.abs(Math.sin(i * 0.8) * Math.cos(j * 0.6)) + i * 3) });
const Bars3D = component('Bars3D', ({ rows }) =>
  group().each(rows, (g, r) => g.add(
    mesh(geo.box(0.82, r.value / 24, 0.82)).pos(r.x, r.value / 48, r.z)
      .color(colors.viridis(r.value / 100)).castShadow()
      .on('hover', $ => $.tooltip(`cell ${r.x + 3},${r.z + 3} · ${r.value}`)))));

return deck('Procedural 3D')
  .slide('terrain', s => s
    .title('Geometry from lambdas, baked at build')
    .subtitle('A 128 × 128 heightfield and a parametric shell, colored by height')
    .add(scene()
      .camera(c => c.pos(8, 6.5, 9).lookAt(0, 0, 0))
      .light(light.hemi('#ffffff', 'subtle', 0.7), light.dir(6, 9, 3).intensity(1.6))

    .title('A recursive component')
    .subtitle('Branch calls itself six levels deep: 364 branches, built once and shared by geometry')
    .add(scene()
      .grid(10)
      .materials({ bark: mat.standard({ color: '#6b4f3a', roughness: 0.9 }), leaf: mat.standard({ color: 'green', roughness: 0.6 }) })
      .camera(c => c.pos(0, 3.4, 8).lookAt(0, 2.4, 0).auto(0.3))
      .light(light.hemi('#ffffff', 'subtle', 0.6), light.dir(4, 10, 6).intensity(1.8).shadows())
      .add(mesh(geo.plane(10, 10)).rot(-90, 0, 0).color('bg').receiveShadow())
      .add(Branch({ depth: 6, len: 1.25 }))))

name: Animated 3D
group: 3D
desc: Four kinds of motion in one scene: frame lambdas, live props, shader uniforms bound to signals, and a surface re-tessellated every frame. Steps drive camera keyframes.
--- deck.js
const ripple = (u, v, t = 0, a = 0.3) => [u * 4 - 2, Math.sin(u * 8 + t) * Math.cos(v * 8) * a, v * 4 - 2];
const displace = `
  uniform float uTime; uniform float uAmp; varying vec3 vN; varying float vH;
  void main() {
    vec3 p = position;
    float h = sin(p.x * 4.0 + uTime * 2.0) * cos(p.y * 4.0 + uTime * 1.3) * uAmp;
    p += normal * h; vH = h;
    vN = normalize(normalMatrix * normal);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }`;
const two = `
  uniform vec3 uColor; uniform vec3 uColor2; varying vec3 vN; varying float vH;
  void main() {
    float light = 0.45 + 0.55 * max(dot(vN, normalize(vec3(0.3, 0.8, 0.6))), 0.0);
    gl_FragColor = vec4(mix(uColor, uColor2, smoothstep(-0.2, 0.2, vH)) * light, 1.0);
  }`;

return deck('Animated 3D')
  .slide('motion', s => {
    const speed = s.sig('speed', 1), amp = s.sig('amp', 0.22);
    const knot = mesh(geo.torusKnot(0.75, 0.25, 220, 28)).as('knot').pos(0, 1.3, 0)
      .mat(mat.physical({ color: 'brand', metalness: 0.6, roughness: 0.25, clearcoat: 1 })).castShadow();
    s.title('Four kinds of motion')
     .subtitle('Press → to move the camera through three keyframes')
     .split([3, 1])
     .left(scene()
       .grid(14)
       .light(light.hemi('#ffffff', 'subtle', 0.5), light.dir(4, 9, 5).intensity(2).shadows())
       .add(mesh(geo.plane(14, 14)).rot(-90, 0, 0).color('bg').receiveShadow())
       // 1 · a frame lambda: imperative, every frame
       .add(knot.frame(($, m, dt) => { m.rotation.y += dt * $(speed); }))
       // 2 · a live prop: position as a function of time
       .add(mesh(geo.sphere(0.18, 32)).as('orb').mat(mat.emissive('accent', 1.4))
         .pos(live($ => [Math.cos($.t * $(speed)) * 2.4, 1.3 + Math.sin($.t * 2) * 0.5, Math.sin($.t * $(speed)) * 2.4])))
       // 3 · shader uniforms bound to the clock and a signal
       .add(mesh(geo.sphere(0.85, 96)).as('blob').pos(-3.3, 1.1, -1.4)
         .mat(mat.shader({ vertex: displace, fragment: two, uniforms: { uTime: live($ => $.t), uAmp: amp, uColor: 'brand', uColor2: 'accent' } })))
       // 4 · a parametric surface whose lambda runs every frame on the CPU
       .add(mesh(geo.parametric(live(($, u, v) => ripple(u, v, $.t * 2, $(amp) * 1.4)), { segments: [44, 44] })).as('ripple')
         .pos(3.3, 0.7, -1.2).scale(0.8).mat(mat.standard({ color: 'green', roughness: 0.55, side: 2 })))
       .camera(c => c.perspective(45).keyframes({
         0: { pos: [0, 3.4, 8.6], lookAt: [0, 1, 0] },
         1: { pos: [2.6, 2.2, 3], lookAt: knot },
         2: { pos: [0, 10.5, 0.01], lookAt: [0, 0, 0], fov: 55 },
       }, { dur: 1400 })))
     .right(stack().gap(22)
       .add(slider(speed, { min: 0, max: 5, step: 0.1, label: 'Speed' }))
       .add(slider(amp, { min: 0, max: 0.6, step: 0.01, label: 'Amplitude' }))
       .add(text('The knot turns in a `frame` lambda. The orb’s position is a `live` prop. The blob is a shader whose uniforms bind to `$.t` and the amplitude signal. The green surface is re-tessellated every frame.').size('sm').color('muted')));
  })
  .slide('phases', s => {
    const amp = s.sig('amp', 0.35);
    s.title('Same lambda, two phases')
     .subtitle('Left: geo.parametric(fn) is baked at build. Right: geo.parametric(live(fn)) runs every frame.')
     .add(scene()
       .camera(c => c.pos(0, 4.2, 7).lookAt(0, 0, 0))
       .light(light.hemi('#ffffff', 'subtle', 0.6), light.dir(3, 8, 4).intensity(1.8))
       .add(mesh(geo.parametric((u, v) => ripple(u, v), { segments: [44, 44] })).pos(-2.4, 0, 0).mat(mat.standard({ color: 'brand', side: 2 })))
       .add(mesh(geo.parametric(live(($, u, v) => ripple(u, v, $.t * 2, $(amp))), { segments: [44, 44] })).pos(2.4, 0, 0).mat(mat.standard({ color: 'accent', side: 2 }))))
     .add(slider(amp, { min: 0, max: 0.8, step: 0.01, label: 'Amplitude, right surface only' }));

##### kinds
name: Custom node kinds
group: Grammar
desc: defineKind adds a node kind with defaults, a build function and a description for agents. The same kind lays out at build time or simulates at runtime, depending on one prop.
--- deck.js
// A layered layout, computed at build time.
const layered = (nodes, edges, W, H) => {
  const depth = Object.fromEntries(nodes.map(n => [n.id, 0]));
  for (let k = 0; k < nodes.length; k++) for (const [a, b] of edges) depth[b] = Math.max(depth[b], depth[a] + 1);
  const cols = {};
  for (const n of nodes) (cols[depth[n.id]] = cols[depth[n.id]] || []).push(n.id);
  const nc = Object.keys(cols).length, pos = {};
  for (const [d, ids] of Object.entries(cols)) ids.forEach((id, i) => { pos[id] = { x: 90 + d * ((W - 180) / Math.max(1, nc - 1)), y: (H / (ids.length + 1)) * (i + 1) }; });
  return pos;
};
const box = (n, transform) => svg.g({ transform }, g => g
  .rect({ x: -70, y: -21, w: 140, h: 42, fill: 'bg', stroke: n.hot ? 'brand' : 'fg', sw: n.hot ? 2.5 : 1.5 })
  .text(n.label, { y: 6, anchor: 'middle', size: 15, fill: 'fg' }));

const flow = defineKind('flow', {
  defaults: { nodes: [], edges: [], layout: 'layered', width: 1080, height: 420 },
  describe: p => `flow diagram · ${p.nodes.length} nodes · ${p.edges.length} edges · ${p.layout} layout`,
  build(b, p) {
    const W = p.width, H = p.height;
    if (p.layout === 'layered') {
      const pos = layered(p.nodes, p.edges, W, H);
      return svg(W, H)
        .each(p.edges, (g, [a, z]) => g.path({ d: `M${pos[a].x + 70} ${pos[a].y} C ${pos[a].x + 150} ${pos[a].y}, ${pos[z].x - 150} ${pos[z].y}, ${pos[z].x - 70} ${pos[z].y}`, stroke: 'muted', width: 1.5, fill: 'none' }))
        .each(p.nodes, (g, n) => g.add(box(n, `translate(${pos[n.id].x} ${pos[n.id].y})`)));
    }
    // force layout: positions are a runtime signal, written by a simulation in an effect
    const start = Object.fromEntries(p.nodes.map((n, i) => [n.id, { x: W / 2 + Math.cos(i * 2.4) * 160, y: H / 2 + Math.sin(i * 2.4) * 110 }]));
    const pos = b.sig('pos', start);
    return svg(W, H)
      .effect($ => {
        let alive = true, steps = 0;
        const vel = Object.fromEntries(p.nodes.map(n => [n.id, { x: 0, y: 0 }]));
        const step = () => {
          if (!alive) return;
          const P = $.peek(pos), next = {};
          for (const a of p.nodes) {
            let fx = (W / 2 - P[a.id].x) * 0.002, fy = (H / 2 - P[a.id].y) * 0.004;
            for (const c of p.nodes) if (c !== a) {
              const dx = P[a.id].x - P[c.id].x, dy = P[a.id].y - P[c.id].y, d2 = Math.max(400, dx * dx + dy * dy);
              fx += (dx / d2) * 1400; fy += (dy / d2) * 900;
            }
            for (const [s1, s2] of p.edges) if (s1 === a.id || s2 === a.id) {
              const o = P[s1 === a.id ? s2 : s1];
              fx += (o.x - P[a.id].x) * 0.012; fy += (o.y - P[a.id].y) * 0.012;
            }
            const v = vel[a.id]; v.x = (v.x + fx) * 0.82; v.y = (v.y + fy) * 0.82;
            next[a.id] = { x: Math.max(80, Math.min(W - 80, P[a.id].x + v.x)), y: Math.max(30, Math.min(H - 30, P[a.id].y + v.y)) };
          }
          $.set(pos, next);
          if (++steps < 900) requestAnimationFrame(step);
        };
        step();
        return () => { alive = false; };
      })
      .each(p.edges, (g, [a, z]) => g.line({ x1: live($ => $(pos)[a].x), y1: live($ => $(pos)[a].y), x2: live($ => $(pos)[z].x), y2: live($ => $(pos)[z].y), stroke: 'muted', width: 1.5 }))
      .each(p.nodes, (g, n) => g.add(box(n, live($ => `translate(${$(pos)[n.id].x} ${$(pos)[n.id].y})`))));
  },
});

const nodes = [
  { id: 'src', label: 'deck.js' }, { id: 'b', label: 'builders' }, { id: 'ir', label: 'IR graph', hot: true },
  { id: 'pass', label: 'passes' }, { id: 'rt', label: 'runtime' }, { id: 'dom', label: 'DOM · SVG' },
  { id: 'gl', label: 'WebGL' }, { id: 'agent', label: 'agent code' }, { id: 'h', label: 'handles' },
];
const edges = [['src', 'b'], ['b', 'ir'], ['ir', 'pass'], ['pass', 'rt'], ['rt', 'dom'], ['rt', 'gl'], ['agent', 'h'], ['h', 'ir']];

return deck('Custom kinds')
  .slide('layered', s => s
    .title('flow({ layout: \'layered\' })')
    .subtitle('Positions are computed at build time and baked into the SVG')
    .add(flow({ nodes, edges, layout: 'layered' }).as('pipeline')))
  .slide('force', s => s
    .title('flow({ layout: \'force\' })')
    .subtitle('Same kind; positions are a signal that a simulation writes at runtime')
    .add(flow({ nodes, edges, layout: 'force' }).as('pipeline')));

  useEffect(() => { if (focus && focus.key) { setOnly(focus.key); setOpen(null); } }, [focus && focus.n]);
  useEffect(() => {
    if (!rec || status === 'starting') return;
    let off = null;
    setErr(null);
    try { off = rec.watch((l) => setList(l), (e) => setErr((e && (e.message || e.code)) || 'The list stopped updating')); } catch (e) { setErr(e.message); }
    return () => { if (off) off(); };
  }, [rec, status]);
  const all = list || [];
  const names = useNames(rec, all.map((s) => s.startedBy));
  if (!rec) return html`<p class="empty pad">Recording is not available.</p>`;
  if (open) return html`<${TranscriptView} rec=${rec} conv=${open} summary=${all.find((x) => x.conv === open)} onBack=${() => setOpen(null)} toastFn=${toastFn} names=${names} />`;
  const keys = [...new Set(all.map((s) => s.key))];
  const label = (k) => { const s = all.find((x) => x.key === k); return s ? (s.kind === 'deck' ? 'deck agent' : s.kind === 'console' ? 'inspector' : `${s.agent} · ${s.slide || ''}`) : k; };
  const shown = all.filter((s) => (only === 'all' || s.key === only) && (!bad || s.hasFailures));
  const nBad = all.filter((s) => (only === 'all' || s.key === only) && s.hasFailures).length;
  return html`<div class="tr-log">
    <div class="subbar wrap">
      <select class="sel" value=${only} onChange=${(e) => setOnly(e.target.value)} aria-label="Which agent">
        <option value="all">All agents</option>
        ${(keys.includes(only) || only === 'all' ? keys : [only, ...keys]).map((k) => html`<option key=${k} value=${k}>${label(k)}</option>`)}
      </select>
      <label class="check"><input type="checkbox" checked=${bad} onChange=${(e) => setBad(e.target.checked)} />With failures${nBad ? ` (${nBad})` : ''}</label>
      <span class="meta">${list ? `${shown.length} of ${all.length}` : 'loading…'}</span>
    </div>
    <p class="tr-where">${rec.where}</p>
    ${err ? html`<p class="empty pad bad">${err}</p>` : null}
    <div class="scroll">
      ${list && !shown.length ? html`<p class="empty pad">${all.length ? 'No transcripts match.' : 'No transcripts yet. Ask an agent something and the conversation shows up here, with every tool call and error.'}</p>` : null}
      ${shown.map((s) => {
        const t = rec.totals(s);
        return html`<button key=${s.conv} type="button" class=${'tr-row' + (s.hasFailures ? ' bad' : '')} onClick=${() => setOpen(s.conv)}>
          <span class=${'tr-dot ' + (s.hasFailures ? 'bad' : s.status === 'open' ? 'open' : 'ok')} aria-hidden="true"></span>
          <span class="tr-main">
            <span class="tr-h"><b>${s.kind === 'deck' ? 'deck agent' : s.kind === 'console' ? 'inspector' : s.agent}</b>${s.slide ? html`<span class="muted"> · ${s.slide}</span>` : null}${s.mode ? html`<span class="rchip">${s.mode}${s.tier ? ' · ' + s.tier : ''}</span>` : null}</span>
            <span class="tr-p">${s.firstPrompt || s.lastText || '(no prompt)'}</span>
            <span class="tr-m">${t.turns} ${t.turns === 1 ? 'turn' : 'turns'} · ${t.calls} ${t.calls === 1 ? 'call' : 'calls'}${t.failed ? html` · <b class="bad">${t.failed} failed</b>` : ''}${t.warned ? html` · <b class="warn">${t.warned} with errors</b>` : ''}${t.errors ? ` · ${t.errors} ${t.errors === 1 ? 'error' : 'errors'}` : ''} · ${ago(s.updatedAt || s.startedAt)} · ${names(s.startedBy)}</span>
          </span>
        </button>`;
      })}
    </div>
  </div>`;
}
function TranscriptView({ rec, conv, summary, onBack, toastFn, names }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [onlyBad, setOnlyBad] = useState(false);
  const [confirm, setConfirm] = useState(false);
  const [jsonOpen, setJsonOpen] = useState(false);
  const stamp = summary ? summary.updatedAt : 0;
  useEffect(() => {
    let alive = true;
    rec.load(conv).then((d) => { if (alive) setData(d); }, (e) => { if (alive) setErr((e && (e.message || e.code)) || String(e)); });
    return () => { alive = false; };
  }, [conv, stamp]);
  const s = (data && data.summary) || summary || { conv };
  const msgs = data ? data.msgs : [];
  const failedCalls = new Set(msgs.filter((m) => m.role === 'result' && (m.ok === false || (m.errors && m.errors.length))).map((m) => m.writer + ':' + m.call));
  const shown = onlyBad ? msgs.filter((m) => (m.role === 'code' && failedCalls.has(m.writer + ':' + m.n)) || L.transcriptUtil.isFailure(m)) : msgs;
  const json = () => JSON.stringify({ format: 'lattice-transcript', version: 1, summary: s, messages: msgs }, null, 1);
  const copy = () => {
    const j = json();
    try { navigator.clipboard.writeText(j).then(() => toastFn(`Copied the transcript · ${(j.length / 1024).toFixed(1)} KB of JSON`, 'ok'), () => { setJsonOpen(true); toastFn('The clipboard is blocked here; the JSON is shown below to select', 'warn'); }); }
    catch (e) { setJsonOpen(true); }
  };
  const del = async () => {
    try { await rec.remove(conv); toastFn('Deleted the transcript', 'ok'); onBack(); }
    catch (e) { toastFn(`Could not delete it: ${(e && (e.message || e.code)) || e}`, 'bad'); setConfirm(false); }
  };
  const t = rec.totals(s);
  let lastWriter = null;
  return html`<div class="tr-view">
    <div class="subbar wrap">
      <button class="link" type="button" onClick=${onBack}>‹ History</button>
      <b class="tr-title">${s.kind === 'deck' ? 'deck agent' : s.kind === 'console' ? 'inspector' : s.agent || '…'}${s.slide ? html`<span class="muted"> · ${s.slide}</span>` : null}</b>
      <span class="grow"></span>
      <button class="btn tiny" type="button" onClick=${copy} disabled=${!data}>Copy JSON</button>
      ${confirm ? html`<span class="confirm">Delete for everyone? <button class="btn tiny bad" type="button" onClick=${del}>Delete</button><button class="link" type="button" onClick=${() => setConfirm(false)}>Keep</button></span>`
        : html`<button class="btn tiny" type="button" onClick=${() => setConfirm(true)}>Delete</button>`}
    </div>
    <div class="tr-sum">
      <span>${s.startedAt ? new Date(s.startedAt).toLocaleString() : ''}</span>
      <span>${t.turns} ${t.turns === 1 ? 'turn' : 'turns'} · ${t.calls} ${t.calls === 1 ? 'call' : 'calls'}${t.failed ? ` · ${t.failed} failed` : ''}${t.warned ? ` · ${t.warned} with errors` : ''}${t.errors ? ` · ${t.errors} ${t.errors === 1 ? 'error' : 'errors'}` : ''}</span>
      <span>${s.status === 'open' ? 'open' : 'closed'} · <code>${conv}</code></span>
      ${t.people.length ? html`<span>by ${t.people.map(names).join(', ')}</span>` : null}
      <label class="check"><input type="checkbox" checked=${onlyBad} onChange=${(e) => setOnlyBad(e.target.checked)} />Failures only</label>
    </div>
    ${jsonOpen ? html`<textarea class="tr-json" readonly value=${json()} onFocus=${(e) => e.target.select()} aria-label="Transcript JSON"></textarea>` : null}
    <div class="scroll tr-msgs">
      ${err ? html`<p class="empty pad bad">${err}</p>` : !data ? html`<p class="empty pad">Loading…</p>` : !shown.length ? html`<p class="empty pad">${onlyBad ? 'No failures in this conversation.' : 'No messages saved yet.'}</p>` : null}
      ${shown.map((m) => {
        const by = m.writer !== lastWriter && Object.keys(data.writers || {}).length > 1 ? names(m.uid) : null; lastWriter = m.writer;
        const k = m.writer + ':' + m.n;
        if (m.role === 'turn') return html`<div key=${k} class=${'tr-turn' + (m.outcome && m.outcome !== 'done' ? ' bad' : m.failed ? ' warnish' : '')}>
          turn ${m.turn} · ${m.mode}${m.tier ? ' · ' + m.tier : ''}${m.tierApplied ? ' → ' + m.tierApplied : ''} · ${m.calls || 0} calls${m.failed ? ` · ${m.failed} failed` : ''}${m.warned ? ` · ${m.warned} with errors` : ''}${m.rounds ? ` · ~${m.rounds} rounds` : ''} · ${secs(m.ms)} · ${m.outcome}${m.truncated ? ' · cut short' : ''}${m.errorCode ? ' · ' + m.errorCode : ''}
          ${m.partial ? html`<details><summary>Partial answer</summary><pre class="snip">${m.partial}</pre></details>` : null}
        </div>`;
        if (m.role === 'system') return html`<details key=${k} class="tr-sys"><summary>Rules sent to Claude · ${(m.text || '').length.toLocaleString()} chars</summary><pre class="snip">${m.text}</pre></details>`;
        return html`<div key=${k} class=${'msg ' + m.role + (m.ok === false ? ' bad' : '') + (m.role === 'result' && m.ok && m.errors && m.errors.length ? ' warn' : '') + (m.runtime ? ' runtime' : '')}>
          <span class="who">${m.role === 'user' ? by || 'user' : m.role === 'code' ? `run_js${m.round ? ' · round ' + m.round : ''}` : m.role}${m.role !== 'user' && by ? ' · ' + by : ''}${m.ms != null ? ` · ${m.ms} ms` : ''} · ${new Date(m.t).toLocaleTimeString()}</span>
          ${m.role === 'code' ? html`<pre class="snip">${m.text}</pre>` : m.role === 'result' ? html`<${ResultBody} m=${m} />` : m.text}
          ${m.ctx ? html`<details><summary>What the agent saw</summary><pre class="snip">${m.ctx}</pre></details>` : null}
        </div>`;
      })}
    </div>
  </div>`;
}

function AgentsPanel({ show, ver, mode, replies, rec, nav, toastFn }) {
  const [pick, setPick] = useState('deck');
  const [view, setView] = useState('chat');
  const [focus, setFocus] = useState(null);
  const g = show && show.g;
  const embedded = useMemo(() => {
    if (!g) return [];
    const out = [];
    for (const n of g.nodes.values()) if (n.kind === 'agent') out.push(n);
    return out;
  }, [g, ver]);
  useEffect(() => {
    if (!nav) return;
    setView(nav.view || 'history');
    if (nav.key) {
      setFocus({ key: nav.key, n: nav.n });
      const n = embedded.find((x) => L.agentDefOf(x).key === nav.key);
      setPick(n ? n.id : nav.key === 'deck' ? 'deck' : pick);
    }
  }, [nav && nav.n]);
  if (!show) return html`<div class="panel"><p class="empty pad">Build the deck first.</p></div>`;
  const cur = pick === 'deck' ? null : embedded.find((n) => n.id === pick);
  const def = cur ? L.agentDefOf(cur) : DECK_AGENT;
  const sugg = cur ? cur.props.suggest || [] : (replies.deck || []).map((r) => r.prompt).filter(Boolean);
  const toHistory = () => { setFocus({ key: def.key, n: Date.now() }); setView('history'); };
  return html`<div class="panel">
    <div class="subbar">
      <${Seg} small=${true} label="Agents view" value=${view} set=${(v) => { if (v === 'history') setFocus(null); setView(v); }} opts=${[['chat', 'Chat'], ['history', 'History']]} />
      ${view === 'chat' ? html`<div class="agent-pick">
        <button type="button" class=${'chip' + (pick === 'deck' ? ' on' : '')} onClick=${() => setPick('deck')}>deck agent</button>
        ${embedded.map((n) => html`<button key=${n.id} type="button" class=${'chip' + (pick === n.id ? ' on' : '')} onClick=${() => setPick(n.id)}>${n.props.name} <span class="muted">· ${n.slide}</span></button>`)}
      </div>` : null}
    </div>
    ${view === 'chat'
      ? html`<${Chat} key=${def.key} show=${show} def=${def} suggestions=${sugg} mode=${mode} slideId=${cur ? cur.slide : null} onGo=${() => cur && show.goTo(cur.slide)} onHistory=${toHistory} />`
      : html`<${TranscriptLog} rec=${rec} show=${show} focus=${focus} toastFn=${toastFn} />`}
  </div>`;
}

/* ------------------------------------------------------------------ events panel */
const EV_FILTERS = [
  ['all', 'All', () => true],
  ['state', 'State', (e) => e.kind === 'signal' || e.kind === 'step' || e.kind === 'mount'],
  ['patch', 'Patches', (e) => e.kind === 'patch' || e.kind === 'restore'],
  ['agent', 'Agents', (e) => e.kind === 'eval' || e.kind === 'agent'],
  ['bad', 'Errors', (e) => e.kind === 'error' || (e.kind === 'eval' && !e.ok)],
];
function evText(e) {
  switch (e.kind) {
    case 'mount': return `mounted ${e.slide} at step ${e.step}`;
    case 'step': return `${e.slide} → step ${e.step}`;
    case 'signal': return `${e.id.replace(/^sig:/, '')} = ${e.value}`;
    case 'patch': return `${e.op} ${e.id || e.parent || ''}${e.key ? '.' + e.key : ''}${e.value ? ' = ' + e.value : ''}${e.ids ? ' + ' + e.ids.join(', ') : ''}${e.count ? ` (${e.count} nodes)` : ''}`;
    case 'eval': return `${e.agent}: ${e.ok ? '✓ ' + clip(e.value, 90) : '✗ ' + e.error}`;
    case 'agent': return `${e.agent} ← ${clip(e.text, 90)}`;
    case 'error': return `${e.where}: ${e.message}`;
    case 'restore': return `rolled back to "${e.label}"`;
    case 'log': return e.text;
    case 'toast': return e.text;
    case 'mode': return `model: ${e.mode}`;
    default: return e.kind;
  }
}
function EventsPanel({ show, ver }) {
  const [f, setF] = useState('all');
  if (!show) return html`<div class="panel"><p class="empty pad">No events yet.</p></div>`;
  const fn = EV_FILTERS.find((x) => x[0] === f)[2];
  const list = [];
  for (let i = show.events.length - 1; i >= 0 && list.length < 400; i--) { const e = show.events[i]; if (e.kind !== 'toast' && fn(e)) list.push(e); }
  return html`<div class="panel">
    <div class="subbar"><${Seg} small=${true} label="Filter events" value=${f} set=${setF} opts=${EV_FILTERS.map(([k, l]) => [k, l])} /><span class="meta">${show.events.length} events · v${show.g.version}</span></div>
    <div class="scroll evlist">${list.length ? list.map((e) => html`<div key=${e.i} class=${'ev ' + e.kind + (e.kind === 'eval' && !e.ok ? ' bad' : '')}>
      <span class="m">${fmtT(e.t)}</span><span class="kd">${e.kind}</span><span class="what" title=${evText(e)}>${evText(e)}</span>
    </div>`) : html`<p class="empty pad">Nothing here yet.</p>`}</div>
  </div>`;
}

/* ------------------------------------------------------------------ people (live sessions) */
const initial = (name) => (String(name || '?').trim()[0] || '?').toUpperCase();
function Avatar({ p, size = 24 }) {
  return html`<span class=${'avatar' + (p.me ? ' me' : '')} style=${{ '--pc': p.color, width: size + 'px', height: size + 'px' }} title=${p.name + (p.me ? ' (you)' : '')}>
    ${p.avatar ? html`<img src=${p.avatar} alt="" />` : html`<b>${initial(p.name)}</b>`}
  </span>`;
}
function personList(collab, presetId) {
  if (!collab) return [];
  return collab.peers.map((p) => {
    const pr = p.presence || {};
    return {
      peer: p.peer, me: p.sameTab, otherTab: p.isMe && !p.sameTab, kind: p.kind, guest: p.guest,
      name: collab.nameOf(p), color: collab.colorOf(p), avatar: collab.avatarOf(p),
      idx: Number.isInteger(pr.idx) ? pr.idx : null, step: Number.isInteger(pr.step) ? pr.step : 0, slide: typeof pr.slide === 'string' ? pr.slide : null,
      sameDeck: !pr.preset || pr.preset === presetId, editing: pr.edit && (pr.edit.file === 'deck' || pr.edit.file === 'replies') ? pr.edit.file : null,
      presenting: pr.presenting === true, follow: typeof pr.follow === 'string' ? pr.follow : null, ro: !!pr.ro,
      cursor: pr.cursor && typeof pr.cursor.x === 'number' && typeof pr.cursor.y === 'number' ? pr.cursor : null,
      sel: typeof pr.sel === 'string' && pr.sel.length < 300 ? pr.sel : null, idle: Date.now() - p.updatedAt > 120000,

    };
  });
}
function PeoplePanel({ collab, cver, presetId, onGo }) {
  const [code, setCode] = useState('');
  void cver;
  const shared = html`<h5 class="sec">What a session shares</h5>
    <ul class="plain">
      <li><b>The deck:</b> deck.js, the replies file and the preset. One person holds the pen on each file at a time; everyone else sees their edits as they type.</li>
      <li><b>Agents:</b> chats with every agent, and the code they run, replayed on each screen so the live slides stay alike.</li>
      <li><b>Presence:</b> where each person is in the deck, their pointer over the slide and what they selected.</li>
      <li><b>Yours alone:</b> your place in the deck (unless you follow someone), your panels, and Claude calls you make, which use your own account.</li>
    </ul>`;
  if (!collab || collab.status === 'unavailable' || collab.status === 'off') {
    return html`<div class="panel"><div class="scroll pad">
      <h5 class="sec">Live session</h5>
      <p class="empty">Live sessions work on the published page when you open it signed in to Claude. In this view you work alone; everything else works the same.</p>
      ${shared}
    </div></div>`;
  }
  if (collab.status === 'ended') return html`<div class="panel"><div class="scroll pad"><h5 class="sec">Live session</h5><p class="empty">This page's live session ended. Reload the page to reconnect.</p>${shared}</div></div>`;
  const people = personList(collab, presetId);
  const others = people.filter((p) => !p.me);
  const byPeer = new Map(people.map((p) => [p.peer, p]));
  const join = (e) => { e.preventDefault(); if (code.trim()) collab.joinSession(code).then((ok) => ok && setCode('')); };
  return html`<div class="panel"><div class="scroll pad">
    <div class=${'live-card' + (collab.connected ? ' on' : '')}>
      <div class="lc-row"><span class="live-dot"></span><b>${collab.connected ? 'Live' : 'Connecting…'}</b><span class="muted">${people.filter((p) => p.kind === 'viewer').length} ${people.filter((p) => p.kind === 'viewer').length === 1 ? 'person' : 'people'} here${collab.synced ? '' : ' · syncing the deck'}</span></div>
      <div class="lc-row"><span class="eyebrow">Session</span><code>${collab.session || 'everyone with this page open'}</code></div>
      <div class="lc-actions">
        ${collab.session ? html`<button class="btn tiny" type="button" onClick=${() => collab.leaveSession()}>Leave session</button>` : html`<button class="btn tiny" type="button" onClick=${() => collab.newSession()}>New private session</button>`}
        <form class="join" onSubmit=${join}>
          <input id="session-code" type="text" value=${code} onInput=${(e) => setCode(e.target.value)} placeholder="session name" aria-label="Session name to join" />
          <button class="btn tiny" type="submit" disabled=${!code.trim()}>Join</button>
        </form>
      </div>
      ${collab.readonly ? html`<p class="note">You can follow along, but your edits are not shared. Ask the owner for edit access to change the deck.</p>` : null}
    </div>
    <h5 class="sec">People<span class="meta">${others.length ? 'click Follow to mirror someone’s slide' : 'only you so far'}</span></h5>
    <ul class="people">
      ${people.map((p) => {
        const what = [];
        if (p.kind === 'agent') what.push('publishing session');
        else if (p.away) what.push(`in session ${p.away}`);
        else if (!p.sameDeck) what.push('on another deck');
        else if (p.idx != null) what.push(`S-${String(p.idx + 1).padStart(2, '0')}${p.step ? ' · step ' + p.step : ''}`);
        if (p.editing) what.push(`editing ${p.editing === 'deck' ? 'deck.js' : 'replies'}`);
        if (p.follow && byPeer.get(p.follow)) what.push(`following ${byPeer.get(p.follow).me ? 'you' : byPeer.get(p.follow).name}`);
        if (p.ro) what.push('view only');
        return html`<li key=${p.peer} class=${p.idle ? 'idle' : ''}>
          <${Avatar} p=${p} size=${28} />
          <div class="pp">
            <div class="pn">${p.name}${p.me ? html` <span class="rchip">you</span>` : null}${p.guest ? html` <span class="rchip">guest</span>` : null}${p.presenting ? html` <span class="rchip pres">presenting</span>` : null}</div>
            <div class="pw">${what.join(' · ') || 'here'}</div>
          </div>
          ${!p.me && !p.away && p.kind === 'viewer' && p.sameDeck && p.idx != null ? html`<div class="pa">
            <button class="btn tiny" type="button" onClick=${() => onGo(p)}>Go to</button>
            ${collab.followPeer === p.peer ? html`<button class="btn tiny primary" type="button" onClick=${() => collab.unfollow()}>Following</button>` : html`<button class="btn tiny" type="button" onClick=${() => collab.follow(p.peer)}>Follow</button>`}
          </div>` : null}
        </li>`;
      })}
    </ul>
    <h5 class="sec">Settings</h5>
    <label class="check"><input type="checkbox" id="present-all" checked=${collab.presenting} onChange=${(e) => collab.setPresenting(e.target.checked)} /> <span><b>Present to everyone.</b> Others get a button to follow your slides.</span></label>
